function analyticsData(s) {
  const period=reportPeriod(s);
  const visible=row=>!s.pr||s.pr==='All practitioners'||row.operator===s.pr;
  return {...period, rows:period.rows.filter(visible), previous:period.previous.filter(visible)};
}
function changeLabel(current, previous) {
  if (!(previous>0)) return '';
  const percent=(current/previous-1)*100;
  return (percent>=0?'+':'−')+Math.abs(percent).toFixed(1)+'%';
}
function analyticChoice(items,key,value) {
  return '<div class="an-toggle" role="group" aria-label="'+(key==='v'?'Measure':'Chart display')+'">'+items.map(([label,choice])=>'<button type="button" data-act="'+esc(key+'|'+choice)+'" aria-pressed="'+(value===choice)+'">'+label+'</button>').join('')+'</div>';
}
function reportSeries(p, measure, previous, running) {
  const dates=new Map();
  for (const row of previous?p.previous:p.rows) {
    const date=visitISO(row);
    dates.set(date,(dates.get(date)||0)+(measure==='Visits'?1:row.paid));
  }
  let total=0;
  return p.buckets.map(b=>{
    const start=previous?b.priorFrom:b.from, end=previous?b.priorTo:b.to;
    if (!start || !end || (previous&&!p.priorAvailable)) return null;
    let bucket=0;
    for (const [date,value] of dates) if(date>=start && date<=end)bucket+=value;
    total+=bucket;
    return running?total:bucket;
  });
}
function analyticsChartModel(p,s) {
  const running=s.chart!=='Daily', measure=s.v==='Visits'?'Visits':'Money';
  return {measure,running,display:running?'Running total':p.isYear?'Monthly':'Daily',
    current:reportSeries(p,measure,false,running),comparison:reportSeries(p,measure,true,running)};
}
function shortBucketDate(date,monthly) {
  return new Intl.DateTimeFormat('en-CA',monthly?{month:'short',year:'numeric',timeZone:'UTC'}:{month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(date+'T00:00:00Z'));
}
function numberFor(measure,amount) {
  return measure==='Money'?money(amount,amount%1?2:0):amount+' '+(amount===1?'visit':'visits');
}
function chartReadout(p,m,index) {
  const bucket=p.buckets[index];
  const label=when=>when?shortBucketDate(when,p.isYear):'';
  const readings=[];
  if(bucket.to)readings.push('<strong>'+(m.running?'Through ':'')+label(bucket.to)+'</strong><span>'+numberFor(m.measure,m.current[index])+'</span>');
  if(p.priorAvailable&&bucket.priorTo)readings.push('<span class="an-secondary">Comparison · '+label(bucket.priorTo)+' · '+numberFor(m.measure,m.comparison[index])+'</span>');
  return readings.join('');
}
function plot(p,s){
  const m=analyticsChartModel(p,s),n=p.buckets.length;
  const moneyChart=m.measure==='Money';
  const currentTotal=moneyChart?sum(p.rows,r=>r.paid):p.rows.length,previousTotal=moneyChart?sum(p.previous,r=>r.paid):p.previous.length;
  const delta=p.priorAvailable?changeLabel(currentTotal,previousTotal):'';
  const left=49,right=606,top=14,bottom=153;
  const x=i=>left+(n>1?i/(n-1):0)*(right-left);
  const peak=Math.max(1,...m.current,...m.comparison),base=10**Math.floor(Math.log10(Math.max(peak/3,1)));
  const tick=[1,2,2.5,4,5,10].map(v=>v*base).find(v=>v>=peak/3);
  const step=moneyChart?tick:Math.ceil(tick),max=step*Math.ceil(peak/step),y=v=>bottom-v/max*(bottom-top);
  const grid=[];
  for(let val=0;val<=max;val+=step){
    const label=moneyChart?(val>=1000?'$'+Number((val/1000).toFixed(1))+'k':'$'+val):val;
    grid.push('<path stroke="#dce5e8" stroke-dasharray="3 4" d="M49 '+y(val)+'H606"/><text x="39" y="'+(y(val)+4)+'" text-anchor="end">'+label+'</text>');
  }
  function points(series){return series.flatMap((v,i)=>v===null?[]:[[x(i),y(v)]]);}
  function path(pts){return pts.map(([x,y],i)=>(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)).join(' ');}
  const cur=points(m.current),prev=points(m.comparison),endIndex=p.buckets.findLastIndex(b=>!!b.to);
  const stepLabel=i=>p.isYear?shortBucketDate(p.buckets[i].from||p.buckets[i].priorFrom,true).split(' ')[0]:Number((p.buckets[i].from||p.buckets[i].priorFrom).slice(-2));
  const positions=[...new Set(Array.from({length:Math.min(6,n)},(_,i)=>Math.round(i*(n-1)/(Math.min(6,n)-1||1))))];
  const labels=positions.map(i=>'<text x="'+x(i)+'" y="177" text-anchor="'+(i===n-1?'end':'middle')+'">'+stepLabel(i)+'</text>').join('');
  const comparable=p.priorAvailable?'<div class="an-comparison">'+(delta?'<b>'+delta+'</b> ':'')+'vs '+esc(p.priorLabel)+' <span>· '+numberFor(m.measure,previousTotal)+'</span></div>':'<div class="an-comparison">Comparison unavailable for '+esc(p.priorLabel)+'.</div>';
  const draw='<svg viewBox="0 0 630 190" id="an-chart" role="img" aria-label="'+esc(m.display+' '+m.measure+' for '+p.label)+'"><defs><linearGradient id="an-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#93b7c8" stop-opacity=".44"/><stop offset="1" stop-color="#93b7c8" stop-opacity=".04"/></linearGradient></defs>'+grid.join('')+labels+(cur.length?'<path d="'+path(cur)+' L'+cur.at(-1)[0]+' '+bottom+' L'+cur[0][0]+' '+bottom+' Z" fill="url(#an-fill)"/>':'')+(prev.length?'<path d="'+path(prev)+'" fill="none" stroke="#8e9ea9" stroke-width="2.3" stroke-dasharray="5 5"/>':'')+'<path d="'+path(cur)+'" fill="none" stroke="#305a70" stroke-width="3" stroke-linejoin="round"/><g id="an-cursor" transform="translate('+x(endIndex)+' 0)"><path d="M0 14V153" stroke="#648498" stroke-dasharray="3 3"/><circle r="5" cx="0" cy="'+y(m.current[endIndex])+'" fill="#254e64" stroke="#fff" stroke-width="2"/></g></svg>';
  const extraPrior=p.buckets.filter(b=>!b.from&&b.priorFrom);
  const alignment=extraPrior.length&&p.priorAvailable?'<p class="tiny">'+shortBucketDate(extraPrior[0].priorFrom,false)+(extraPrior.length>1?'–'+Number(extraPrior.at(-1).priorTo.slice(-2)):'')+' '+(extraPrior.length===1?'appears':'appear')+' on the comparison line only.</p>':'';
  const readingUnit=p.isYear?'month':'day',cad=moneyChart?'<small>CAD</small>':'';
  const daily=reportSeries(p,m.measure,false,false),prior=reportSeries(p,m.measure,true,false);
  return '<section class="an-hero"><div class="an-mainrow"><div><h2>'+(moneyChart?esc(p.collectedLabel):'Completed visits')+'</h2><div class="an-value">'+(moneyChart?money(currentTotal,currentTotal%1?2:0):currentTotal)+cad+'</div></div>'+analyticChoice([['Money','Money'],['Visits','Visits']],'v',m.measure)+'</div>'+comparable+
    '<div class="an-chartbar"><div class="an-legend"><span><i></i>'+esc(p.shortLabel)+'</span>'+(p.priorAvailable?'<span><i></i>'+esc(p.priorShortLabel)+'</span>':'')+'</div>'+analyticChoice([['Running total','Running total'],[p.isYear?'Monthly':'Daily','Daily']],'chart',s.chart==='Daily'?'Daily':'Running total')+'</div><div class="an-plot">'+draw+'<input type="range" class="an-scrub" min="1" max="'+n+'" value="'+(endIndex+1)+'" aria-label="Inspect a '+readingUnit+' on the chart" aria-valuetext="'+esc(p.buckets[endIndex].label)+'" data-points="'+m.current.map(v=>v===null?'':y(v).toFixed(1)).join(',')+'"></div><div class="an-readout" id="an-readout">'+chartReadout(p,m,endIndex)+'</div>'+alignment+
    details('View '+(p.isYear?'monthly':'daily')+' figures','<div class="chartdata">'+table([p.isYear?'Month':'Day',p.shortLabel,...(p.priorAvailable?[p.priorShortLabel]:[])],p.buckets.map((b,i)=>[b.from?b.label:b.priorLabel,daily[i]===null?'—':numberFor(m.measure,daily[i]),...(p.priorAvailable?[prior[i]===null?'—':numberFor(m.measure,prior[i])]:[])]))+'</div>')+'</section>';
}
function inspectPeriodPoint(input,i){

document.addEventListener('pointermove',e=>{

  const rect=e.target.getBoundingClientRect(),last=Number(e.target.max)-1;

function clientGroup(p,client) {
  const seen=visits.filter(r=>r.name===client && visitISO(r)<=p.end);
  return seen.some(r=>visitISO(r)<p.start)||seen.some(r=>r.first===false)?'Returning':'First recorded visit';
}
function intervalDays(p){
  const clients=new Set(p.rows.map(r=>r.name));
  let gaps=0,days=0;
  for(const name of clients){
    const dates=[...new Set(visits.filter(r=>r.name===name&&visitISO(r)<=p.end).map(visitISO))].sort();
    dates.forEach((date,i)=>{if(i&&date>=p.start){days+=(Date.parse(date)-Date.parse(dates[i-1]))/86400000;gaps++}});
  }
  return gaps?Math.round(days/gaps):null;
}
function mix(p){
  const seen=[...new Set(p.rows.map(r=>r.name))],ret=seen.filter(n=>clientGroup(p,n)==='Returning').length;
  const pct=seen.length?Math.round(100*ret/seen.length):0;
  return '<section class="an-card"><div class="split"><h2>Client mix</h2><span class="tiny">'+seen.length+' seen</span></div><div class="an-mix"><span class="an-bignum">'+pct+'%<small>returning</small></span><div class="an-dots" aria-hidden="true">'+seen.map((_,i)=>'<i'+(i<ret?' class="returning"':'')+'></i>').join('')+'</div></div>'+line('Returning clients',ret)+line('First recorded visit',seen.length-ret)+'</section>';
}
function anMetric(label,value,old,current,period,note){

}

function methods(rs){
  const totals = new Map();
  for (const visit of rs) {
    const receipts = visit.receipts || [{method: visit.method, amount: visit.paid}];
    for (const receipt of receipts) {
      if (receipt.amount) totals.set(receipt.method, (totals.get(receipt.method) || 0) + receipt.amount);
    }
  }
  const total = sum(rs, r => r.paid);
  const cardShare = total ? (totals.get('Card') || 0) / total * 100 : 0;
  return '<div class="methodbar"><i style="width:'+cardShare+'%"></i></div>'+['Card','E-transfer','Cash','Other'].filter(k=>totals.has(k)).map(k=>line(k,money(totals.get(k)))).join('');
}
function receiptEntries(r) {
  if (r.receipts) return r.receipts;
  return r.paid ? [{method:r.method, amount:r.paid, date:r.received}] : [];
}
const lastStatementMonth='2026-11';
const isStatementMonth=key=>/^\d{4}-(0[1-9]|1[0-2])$/.test(key||'') && key>='0001-01' && key<=lastStatementMonth;
function statementMonthKey(s){

}
const statementRows=s=>visits.filter(r=>visitISO(r).slice(0,7)===statementMonthKey(s));
function statementMonthLabel(key){

function shiftStatementMonth(key,delta){

const visitDate=r=>new Date(visitISO(r)+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
const remainder=r=>Math.round((r.fee-r.paid)*100)/100;

const payState=r=>r.state==='Money owed' && r.paid>0?'Partial payment':r.state;
function visitDayValue(r){return Number(visitISO(r).replaceAll('-',''))}
function ledger(rs){

function historyScope(s) {return s.historyScope==='month'?'month':'all'}
function clockMinutes(time) {
  const [hour,minute,period]=time.split(/[: ]/);
  return (Number(hour)%12+(period==='PM'?12:0))*60+Number(minute);
}
function clientVisits(name) {
  return visits.filter(v=>v.name===name).sort((a,b)=>visitDayValue(b)-visitDayValue(a)||clockMinutes(b.time)-clockMinutes(a.time)||a.id.localeCompare(b.id));
}
function historyRows(s){

  const query=new URLSearchParams(location.hash.slice(1));

  history.replaceState({...history.state,scrollY:window.scrollY,visitButton:button?.dataset.act},'');

function closeClientVisit(){
  if(!get().visit){$('#modal').close();return;}

function historyGroups(rows){
  const groups=new Map();
  for(const visit of rows){

function homeTrend(report) {

  const current=totals(report.rows,report.start,report.end);

  const peak=Math.max(...current,...previous,1);

  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i,a.length).toFixed(1)+' '+y(v).toFixed(1)).join(' ');

}

  const nReview=visits.filter(r=>r.state==='Needs review').length, owed=visits.filter(r=>r.state==='Money owed');
  const pending=visits.filter(r=>r.state==='Processing').length;
  const rebook=capacityPlans.filter(plan=>!plan.slot);
  const debt=sum(owed,r=>r.fee-r.paid);
  const monthText=homeDateText(period.currentMonth+'-01',{month:'long',year:'numeric'});
  const lastCard=period.isYear
    ? '<section class="homestatement"><span class="papericon">'+icon('analytics')+'</span><div><h2>Clients seen year to date</h2><p>'+esc(period.label)+'</p></div>'+workspaceLink('analytics','Explore clients '+icon('arrow'),{...selected,tab:'Clients'},'outlineLink')+'</section>'
    : '<section class="homestatement"><span class="papericon">'+icon('statements')+'</span><div><h2>'+esc(monthText)+' statement</h2><p>'+ (period.available?t.payers+' '+(t.payers===1?'visit':'visits')+' with recorded payments':'No sample records for this month')+'</p></div>'+workspaceLink('statements','Open statement '+icon('arrow'),{...selected,statementMonth:period.currentMonth},'outlineLink')+'</section>';
  return '<div class="homeview"><div class="homehead"><div><h1>Business overview</h1><p>Example Studio <span>·</span> Example City</p></div></div>'+periodControls(s)+
    '<section class="homehero"><div class="heroabove"><div class="homeherobody"><div class="herolabel">'+esc(period.collectedLabel)+'</div><div class="herovalue">'+(period.available?money(t.total,t.total%1?2:0)+'<small>CAD</small>':'—')+'</div>'+comparison+'<div class="heroperiod">'+esc(period.label)+'</div></div>'+homeTrend(period)+'</div><div class="herobottom"><div><span>Completed visits</span><strong>'+(period.available?t.completed:'—')+'</strong></div><div><span>Clients seen</span><strong>'+(period.available?t.active:'—')+'</strong></div><div><span>Average paid visit</span><strong>'+(period.available&&t.payers?money(t.total/t.payers):'—')+'</strong></div>'+workspaceLink('analytics','Explore analytics '+icon('arrow'),selected,'herolink')+'</div></section>'+
    '<div class="homegrid"><section class="groupbox"><div class="grouphead"><h2>Payment follow-up</h2><small>All visit dates</small></div>'+
    homeAction('list','Needs review',nReview,'All dates · Payment outcome unclear','payments',{queue:'Needs review'},'wheat')+
    homeAction('payments','Money owed',money(debt,debt%1?2:0),'All dates · Unpaid balance on '+owed.length+' '+(owed.length===1?'visit':'visits'),'payments',{queue:'Money owed'},'mist')+
    homeAction('pending','Processing',pending,'Payments awaiting confirmation','payments',{queue:'Processing'},'fog')+
    '</section><section class="groupbox continuity"><div class="grouphead"><h2>Treatment follow-up</h2><small>As of Nov 20</small></div><div class="continuitybody"><div class="planfigure"><strong>'+rebook.length+'</strong><span>of '+capacityPlans.length+' clients with open plans<br>have no treatment booked</span></div><div class="planmeter" aria-hidden="true">'+capacityPlans.map((_,i)=>'<i class="'+(i<rebook.length?'need':'')+'"></i>').join('')+'</div>'+workspaceLink('capacity','Review rebooking list '+icon('arrow'),{},'hometextlink')+'</div></section></div>'+lastCard+'</div>';
}
function render() {
  const s=get();
  const nav=Object.entries(pages);
  const destination=k=>new URLSearchParams(periodNavigation(s,k));
  $('#rail').innerHTML=nav.map(([k,n])=>'<a href="#'+esc(destination(k))+'" '+(s.p===k?'class="active" aria-current="page"':'')+'>'+icon(k)+n+'</a>').join('');
  $('#mobpage').innerHTML=nav.map(([k,n])=>'<option value="'+k+'" '+(s.p===k?'selected':'')+'>'+n+'</option>').join('');
  $('#main').innerHTML=({home,analytics,statements,payments:queue,capacity})[s.p](s)+'<div class="footer">Design preview · Example client activity. Changes last for this open preview.</div>';
  document.title=pages[s.p]+' · Hone Business';
  document.body.dataset.page=s.p;
  syncClientVisit(s);
}
document.addEventListener('change', e=>{
  if(e.target.id==='mobpage') {
    const k=e.target.value;
    go(periodNavigation(get(),k),true);
  }
});
let previousBusinessPage=get().p;
window.addEventListener('hashchange',()=>{
  if(previousBusinessPage!==get().p){window.scrollTo(0,0);previousBusinessPage=get().p;}
});
function dialog(title,body){let d=$('#modal');d.setAttribute('aria-label',title);d.innerHTML='<div class="split"><h2>'+esc(title)+'</h2>'+btn('Close','close','link')+'</div>'+body;if(!d.open)d.showModal()}
function showRow(id){
  const r=visits.find(v=>v.id===id);if(!r)return;
  dialogRow=r;ledgerMode='';
  const open=['Needs review','Money owed'].includes(r.state);
  const receipts=receiptEntries(r);
  const facts='<section class="fin-facts">'+line('Agreed visit fee',r.fee==null?'Needs confirmation':money(r.fee))+line('Already received',money(r.paid))+(r.state==='Money owed'?line('Money owed',money(remainder(r))):'')+(r.due&&open?line('Follow-up date',esc(r.due)):'')+'</section>';
  const entries=(r.events||[]);
  const history=entries.length?details('Payment history · '+entries.length,entries.map(ev=>'<p>'+esc(ev)+'</p>').join('')):receipts.length?details('Payment history',receipts.map(p=>'<p>'+money(p.amount)+' · '+esc(p.method)+' · '+esc(p.date)+'</p>').join('')):'';
  const actions=r.state==='Processing'?'<p class="notice">This payment is Processing. Its outcome will determine the balance.</p>'+btn('Refresh status','status','primary'):open?'<div class="fin-choices"><h3>Payment decision</h3>'+btn('Record payment received','edit|receive','primary')+(r.fee!=null&&remainder(r)>0?btn('Charge demo card','edit|card'):'')+(r.state==='Needs review'?btn(r.fee==null||r.fee===0?'Confirm no charge':'Waive fee','edit|free'):'')+btn(r.state==='Money owed'?'Set follow-up date':'Confirm balance owed','edit|owed')+'</div>':'';
  dialog(r.name,'<div class="fin-detail"><p>'+visitDate(r)+' · '+esc(r.time)+' · '+esc(r.service)+'<small>Practitioner · '+esc(r.operator)+'</small></p>'+pill(payState(r))+'</div>'+facts+history+actions);
}
const today='2026-11-20';
function edit(mode){
  const r=dialogRow;ledgerMode=mode;
  const input=(n,l,val='',type='text',extra='')=>'<label>'+l+'<input name="'+n+'" type="'+type+'" '+extra+' value="'+esc(val)+'" required></label>';
  const feeInput=r.fee==null?input('fee','Confirm agreed visit fee (CAD)','','number','min="0.01" step="0.01"'):'';
  let title,fields;
  if(mode==='receive'){
    title='Record payment received';
    fields=feeInput+'<label>Payment method<select name="method">'+['E-transfer','Cash','Other'].map(t=>op(t,'E-transfer')).join('')+'</select></label><div class="fin-field-pair">'+input('amount','Amount received (CAD)',r.fee!=null?remainder(r).toFixed(2):'','number','min="0.01" step="0.01"')+input('date','Date received',today,'date','max="'+today+'"')+'</div><div id="balpreview" role="status" class="fin-bal"></div>';
  }else if(mode==='owed'){
    title=r.state==='Money owed'?'Schedule follow-up':'Confirm balance owed';
    fields=feeInput+(r.fee!=null?line('Unpaid balance',money(remainder(r))):'')+'<label>Follow-up date (optional)<input type="date" name="due" value="'+esc(r.due||'')+'"></label>';
  }else if(mode==='card'){
    title='Charge demo card';fields=line('Amount to charge',money(remainder(r)))+'<p class="notice">Confirm to simulate a successful card payment in this preview.</p>';
  }else{
    title=(r.fee??0)>0?'Waive fee':'Confirm no charge';
    fields='<p>'+((r.fee??0)>0?'Waive the agreed fee of '+money(r.fee)+' for this visit?':'Confirm the agreed fee for this particular visit was $0?')+'</p>';
  }
  dialog(title,'<p class="paneNote">'+esc(r.name)+' · '+visitDate(r)+' · '+esc(r.service)+'</p><form id="payform" class="gridform">'+fields+'<div class="error" id="err" role="alert"></div><div class="act">'+btn('Back','backrow')+'<button class="primary" type="submit">'+(mode==='card'?'Confirm demo charge':'Save to preview')+'</button></div></form>');
  if(mode==='receive')balancePreview();
}
function balancePreview(){
  const f=$('#payform'),target=$('#balpreview');if(!f||!target)return;
  const fee=dialogRow.fee??(f.elements.fee?.value?Number(f.elements.fee.value):null);
  const amt=f.elements.amount.value?Number(f.elements.amount.value):null;
  let text='Enter the agreed fee and amount received to see the remaining balance.';
  if(fee!=null&&amt!=null){
    const left=Math.round((fee-dialogRow.paid-amt)*100)/100;
    text=left<0?'Amount exceeds the remaining visit fee.':left===0?'Paid in full. This visit will leave the payment queue.':money(left)+' will remain in Money owed after saving.';
  }
  target.textContent=text;
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='payform')return;
  e.preventDefault();
  const r=dialogRow,f=new FormData(e.target),fee=r.fee??Number(f.get('fee')),mode=ledgerMode;
  let ev='',feedback='';
  if(mode==='receive'||mode==='card'){
    const amt=mode==='card'?remainder(r):Number(f.get('amount'));
    if(!(amt>0)||amt>Math.round((fee-r.paid)*100)/100){$('#err').textContent='Enter an amount up to the remaining visit fee.';return}
    const method=mode==='card'?'Card':f.get('method'),date=mode==='card'?today:f.get('date');
    const prior=receiptEntries(r);
    r.fee=fee;r.paid=Math.round((r.paid+amt)*100)/100;r.received=date;r.method=method;
    r.receipts=prior.concat({method,amount:amt,date});r.state=r.paid>=r.fee?'Paid':'Money owed';
    ev=money(amt)+' received by '+method+' on '+date;
    feedback=money(amt)+' recorded · '+(r.state==='Paid'?'Paid in full':money(remainder(r))+' still owed');
  }else if(mode==='free'){
    r.state=(r.fee??0)>0?'Fee waived':'No charge';if(r.fee==null)r.fee=0;ev=r.state;feedback='Visit closed · '+r.state;
  }else{
    r.fee=fee;r.due=f.get('due')||'';r.state='Money owed';
    ev='Balance confirmed '+money(remainder(r))+(r.due?' · Follow up '+r.due:'');feedback=ev;
  }
  r.events=(r.events||[]).concat(ev+' · Entered by Jordan on '+today);
  if(get().visit){closeClientVisit()}else{$('#modal').close();render()}toast(feedback);
});
document.addEventListener('input',e=>{
  if(e.target.closest('#payform')&&ledgerMode==='receive')balancePreview();
  if(e.target.id!=='qsearch')return;
  const s={...get(),qsearch:e.target.value}, source=queueSource(s);
  $('#qresult').outerHTML=queueResults(s,source.filter(r=>r.state===s.queue),s.queue);
  const par=new URLSearchParams(location.hash.slice(1));if(s.qsearch)par.set('qsearch',s.qsearch);else par.delete('qsearch');history.replaceState(null,'','#'+par);
});
document.addEventListener('change',e=>{if(e.target.dataset.key){const key=e.target.dataset.key;go({[key]:e.target.value,...(key==='scope'?{queueFrom:'',queueTo:'',qsearch:''}:{}),...(key==='m'||key==='stmtfilter'?{pg:'1'}:{})})}});
document.addEventListener('submit',e=>{
  if(e.target.id!=='statement-period-form')return;
  e.preventDefault();
  const key=new FormData(e.target).get('month');
  if(isStatementMonth(key))go({statementMonth:key,pg:'1'});
});
document.addEventListener('input',e=>{if(e.target.id!=='search')return;let s={...get(),find:e.target.value};$('#clientslist').outerHTML=clientlist(s,statementRows(s));let par=new URLSearchParams(location.hash.slice(1));par.set('find',s.find);history.replaceState(history.state,'','#'+par)});
function exportStatement(s) {
  let records=statementRows(s);
  if (s.client) records=matchingHistoryRows(s);
  else if(s.view==='Clients' && s.find) records=records.filter(r=>r.name.toLowerCase().includes(s.find.toLowerCase()));
  if (s.client || s.view==='Studio') {
    const status=s.stmtfilter||'All visits';
    if(status!=='All visits') records=records.filter(r=>r.state===status);
  }
  records=[...records].sort((a,b)=>visitDayValue(b)-visitDayValue(a));
  const contents=[['Visit date','Client','Service','Checkout status','Agreed fee (CAD)','Collected (CAD)','Money owed (CAD)','Last receipt date']];
  for(const r of records)contents.push([visitISO(r),r.name,r.service,payState(r),r.fee??'',r.paid,r.state==='Money owed'?remainder(r):'',r.received||'']);
  const csv=contents.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='Hone-Statement-'+(s.client?s.client.replace(/[^a-z0-9]+/gi,'-')+'-':'')+(s.client&&historyScope(s)==='all'?'All-visits':statementMonthKey(s))+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let [a,v]=b.dataset.act.split('|'),s=get();if(['periodreview','periodclient','periodstatement'].includes(a))periodAction(a,v,s);else if(a==='reviewmonth')go({p:'payments',queue:'Needs review',scope:v});else if(a==='stmtmonth')go({statementMonth:v,pg:'1'});else if(a==='row'||a==='firstreview')openClientVisit(v);else if(a==='close')closeClientVisit();else if(a==='edit')edit(v);else if(a==='backrow')showRow(dialogRow.id);else if(a==='status'){dialog('Card payment status','<p class="block">The sample card attempt is still processing. Check this attempt again when its status changes.</p>')}else if(a==='client'||a==='monthlyclient')openClient(v,a==='client'?'all':'month');
else if(a==='queueclient'){const row=visits.find(r=>r.id===v);if(row)openClient(row.name,'all',visitISO(row).slice(0,7))}
else if(a==='historyscope'){go({historyScope:v==='all'?'all':'month',pg:'1',stmtfilter:'All visits',visit:''})}
else if(a==='backclients')go({view:'Clients',client:'',visit:'',historyScope:'',stmtfilter:'All visits',pg:'1'});else if(a==='stmtfilter')go({stmtfilter:v,pg:'1'});else if(a==='view')go({view:v,client:'',find:'',pg:'1',stmtfilter:'All visits'});else if(a==='plan'){dialog(v,'<p class="paneNote">Illustrative treatment plan</p>'+line('Plan','Open')+line('Practitioner','Jordan')+line('Future treatment','None booked')+'<p class="notice">Ready for a rebooking conversation.</p>')}else if(a==='export' && s.p==='statements')exportStatement(s);else if(a==='print')window.print();else go({[a]:v})});let renderedHistoryClient=get().client;
window.addEventListener('hashchange',()=>{
  const oldClient=renderedHistoryClient;
  const s=get();
  renderedHistoryClient=s.client;
  render();
  if(history.state?.visitButton&&!s.visit){
    const b=Array.from(document.querySelectorAll('#main [data-act]')).find(x=>x.dataset.act===history.state.visitButton&&x.offsetWidth);
    if(b)b.focus({preventScroll:true});
  }
  if(Number.isFinite(history.state?.scrollY))window.scrollTo(0,history.state.scrollY);
  else if(oldClient!==s.client)window.scrollTo(0,0);
});
render();
function exportAnalytics(s){
  const p=analyticsData(s);
  if(!p.available)return;
  const source=[['Report',s.tab],['Period start',p.start],['Period end',p.end]];
  if(s.tab==='Waitlist'){
    const w=waitlistReport(p);
    source.push([],['Invitations','Distinct people','Linked bookings','Awaiting response','Declined','Expired','Booking rate'],[w.rows.length,w.people,...w.counts,w.rate]);
  }else if(s.tab==='Clients'){
    source.push(['Practitioner',s.pr],[],['Client','Completed visits','Collected CAD','Client group']);
    for(const name of [...new Set(p.rows.map(r=>r.name))].sort()){
      const rows=p.rows.filter(r=>r.name===name);
      source.push([name,rows.length,sum(rows,r=>r.paid),clientGroup(p,name)]);
    }
  }else{
    const m=analyticsChartModel(p,s),metric=(m.measure==='Money'?'Collected CAD':'Visits')+' · '+m.display;
    source.push(['Practitioner',s.pr],['Comparison start',p.priorStart],['Comparison end',p.priorEnd],['Comparison data',p.priorAvailable?'Available':'Unavailable'],[],
      ['From','Through',metric,...(p.priorAvailable?['Comparison from','Comparison through','Comparison '+metric]:[])]);
    p.buckets.forEach((b,i)=>source.push([b.from,b.to,m.current[i],...(p.priorAvailable?[b.priorFrom,b.priorTo,m.comparison[i]]:[])]));
  }
  const raw=source.map(row=>row.map(cell=>'"'+String(cell??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([raw],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='Hone-'+s.tab+'-'+p.start+'-to-'+p.end+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

document.addEventListener('click',e=>{
  if (e.target.closest('[data-act="export"]') && get().p==='analytics') {
    e.stopImmediatePropagation(); exportAnalytics(get());
  }
},true);
