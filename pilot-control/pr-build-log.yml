# Pilot Control Sheet: PR / build log.
#
# Lightweight history of recent merged PRs so Chloe (and the
# operator) can scan a single sheet to see what shipped, the risk
# level, and whether Chloe needs to test it.
#
# Required fields:
#   pr, name, what_changed, risk_level, merged, needs_chloe_test,
#   smoke_result, notes
#
# Risk level scale:
#   low:    docs/tooling/copy/test only, no runtime behavior change
#   medium: app behavior change with a clear gate or guard
#   high:   payment / RLS / migration / live-mode adjacent
#
# Smoke result values:
#   Pending, Pass, Fail, N/A
#
# When editing this file, run `npm run pilot:export` so the CSV
# under pilot-control/generated/ stays in sync. New entries should
# be added in descending PR-number order at the top.

- pr: 160
  name: Pilot control sheet automation
  what_changed: |
    Adds pilot-control/ YAML trackers + scripts/export-pilot-
    control-sheet.mjs. Generates deterministic CSVs at
    pilot-control/generated/ checked into the repo plus an
    optional Hone_Pilot_Control_Sheet.xlsx generated on demand
    via npm run pilot:export. GitHub Actions CI runs npm run
    pilot:check.
  risk_level: low
  merged: pending
  needs_chloe_test: false
  smoke_result: N/A
  notes: |
    Internal process / tooling. No app runtime behavior changes.
    Flip `merged` to the actual date once this PR lands.

