# REHEARSAL - NEVER MERGE. S1-WAIVER: s1-apply-waiver.sh (row 4 waived by Sam) driven through a pty on macOS arm64 with a STUB supabase-go
# (see rehearsal/s1-waiver/test.sh). No hosted call, no hosted database, no secrets.
name: rehearsal-s1-waiver

on:
  pull_request:
    paths:
      - "rehearsal/s1-waiver/**"
      - ".github/workflows/rehearsal-s1-waiver.yml"

permissions:
  contents: read

jobs:
  s1-waiver:
    name: s1-apply waiver variant (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform facts
        run: |
          uname -sm
          /bin/bash --version | head -1
          python3 --version
          date -u
      - name: The rehearsal
        run: /bin/bash rehearsal/s1-waiver/test.sh
