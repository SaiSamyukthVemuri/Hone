# GUARDS-ORDER-PROOF (closes Photos' PEER-1153 F3). REHEARSAL - NEVER MERGE.
#
# Proves the two window guards (#1124 archive pair, #1153 export pair) are
# installed in the order the S1 operator will use them: on a database at EXACTLY
# 0212 (production's applied max), BEFORE 0213-0246 are applied, and that they
# still hold, and come off cleanly, after 0246.
#
# Synthetic only: a disposable local stack on a GitHub runner; no hosted
# project, no provider, no secret. Not required; it exists on the rehearsal
# branch only and must not be merged. Supply chain as the other workflows:
# actions pinned by SHA, contents: read, persist-credentials: false. The one
# credential is the D7b read-only ghcr.io login (anonymous pulls are throttled),
# held only across a direct pinned-CLI start, exactly as in ci.yml. The CLI is
# the grants-parity pin, supabase@2.102.0, run through npx behind a `supabase`
# shim so the setup-cli action (and its reviewed use count) is not added.

name: guards-order-rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/guards-order-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hone-guards-order-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards-order:
    name: guards order proof (not required)
    runs-on: ubuntu-latest
    # D7b: read-only package scope for the authenticated ghcr.io image pull only.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 40
    env:
      EXCLUDE: studio,imgproxy,realtime,edge-runtime,logflare,vector,storage-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Hold back 0213-0246 (the stack starts at exactly 0212)
        run: |
          set -euo pipefail
          HELD="$RUNNER_TEMP/held"; mkdir -p "$HELD"
          n=0
          for f in supabase/migrations/*.sql; do
            b="$(basename "$f")"; p="${b:0:4}"
            if [ "$p" -ge 213 ] && [ "$p" -le 246 ]; then mv "$f" "$HELD/$b"; n=$((n+1)); fi
          done
          echo "held back $n files"
          [ "$n" -eq 34 ] || { echo "expected 34 files for 0213-0246, held $n"; exit 1; }
          top="$(ls supabase/migrations | tail -1)"; echo "repo max now: $top"
          [ "${top:0:4}" = "0212" ] || { echo "the highest remaining migration is not 0212"; exit 1; }
          ls "$HELD" | sed -n '1p;$p'

      - name: Pinned Supabase CLI shim (supabase@2.102.0 via npx)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec npx --yes supabase@2.102.0 "$@"\n' > "$RUNNER_TEMP/bin/supabase"
          chmod +x "$RUNNER_TEMP/bin/supabase"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in to ghcr.io for Supabase images (D7b, read-only)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start local Supabase at 0212
        id: sb_start
        continue-on-error: true
        shell: bash
        run: supabase start -x "$EXCLUDE" 2>&1 | tee "$RUNNER_TEMP/supabase-start.log"

      - name: Log out of ghcr.io (D7b)
        if: always()
        run: docker logout ghcr.io

      - name: Retry Supabase start once on a port-bind collision (no credential)
        if: steps.sb_start.outcome == 'failure'
        run: bash scripts/ci/supabase-start-bind-retry.sh --after-failed-start "$RUNNER_TEMP/supabase-start.log" supabase start -x "$EXCLUDE"

      - name: The database is at exactly 0212
        shell: bash
        run: |
          set -euo pipefail
          DB="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -1)"
          echo "db container: $DB"; echo "DB=$DB" >> "$GITHUB_ENV"
          max="$(docker exec -i "$DB" psql -U postgres -X -tAc 'select max(version) from supabase_migrations.schema_migrations')"
          echo "applied max: $max"
          [ "$max" = "0212" ] || { echo "expected 0212"; exit 1; }
          has="$(docker exec -i "$DB" psql -U postgres -X -tAc "select count(*) from pg_proc where proname='record_studio_export_audit_governed'")"
          [ "$has" = "0" ] || { echo "0242 is already present"; exit 1; }

      - name: Install BOTH window guards UP (byte-identical fixtures)
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tests/db/fixtures/0242-pause-guard.up.sql tests/db/fixtures/0242-pause-guard.down.sql tests/db/fixtures/0242-pause-export-guard.up.sql tests/db/fixtures/0242-pause-export-guard.down.sql
          runsql() { docker cp "$1" "$DB:/tmp/step.sql" && docker exec -i "$DB" psql -U postgres -X -q -v ON_ERROR_STOP=1 -f /tmp/step.sql; }
          for f in 0242-pause-guard.up.sql 0242-pause-export-guard.up.sql; do
            runsql "tests/db/fixtures/$f"
            echo "installed $f"
          done
          n="$(docker exec -i "$DB" psql -U postgres -X -tAc "select count(*) from pg_trigger where tgname in ('clients_00_pause_archive_trg','audit_logs_00_pause_export_trg') and not tgisinternal")"
          [ "$n" = "2" ] || { echo "expected both guard triggers, found $n"; exit 1; }

      - name: Apply 0213-0246 in order with the guards up
        shell: bash
        run: |
          set -euo pipefail
          runsql() { docker cp "$1" "$DB:/tmp/step.sql" && docker exec -i "$DB" psql -U postgres -X -q -v ON_ERROR_STOP=1 -f /tmp/step.sql; }
          for f in $(ls "$RUNNER_TEMP/held" | sort); do
            runsql "$RUNNER_TEMP/held/$f"
            n="$(docker exec -i "$DB" psql -U postgres -X -tAc "select count(*) from pg_trigger where tgname in ('clients_00_pause_archive_trg','audit_logs_00_pause_export_trg') and not tgisinternal")"
            [ "$n" = "2" ] || { echo "$f: a guard trigger is gone (found $n)"; exit 1; }
            echo "applied $f; guards present: $n"
          done

      - name: Guards still hold after 0246 (archive 55000, export 55000, other audits record)
        shell: bash
        env:
          HONE_GUARDS_ORDER_PROOF: "1"
        run: |
          set -euo pipefail
          npx vitest run --config vitest.db.config.ts tests/db/guards-order-proof.db.test.ts --maxWorkers=2 2>&1 | tee "$RUNNER_TEMP/proof.log"
          ! grep -E "skipped" "$RUNNER_TEMP/proof.log" || { echo "the proof was skipped"; exit 1; }
          grep -E "Tests +[0-9]+ passed" "$RUNNER_TEMP/proof.log"

      - name: Dump the catalog with the guards UP, then DOWN for both
        shell: bash
        run: |
          set -euo pipefail
          runsql() { docker cp "$1" "$DB:/tmp/step.sql" && docker exec -i "$DB" psql -U postgres -X -q -v ON_ERROR_STOP=1 -f /tmp/step.sql; }
          dump() { docker exec -i "$DB" pg_dump -U postgres --schema-only --no-owner --schema=public --schema=auth postgres | grep -vE '^\\(un)?restrict ' > "$1"; }
          dump "$RUNNER_TEMP/guards-up.sql"
          for f in 0242-pause-guard.down.sql 0242-pause-export-guard.down.sql; do
            runsql "tests/db/fixtures/$f"
          done
          n="$(docker exec -i "$DB" psql -U postgres -X -tAc "select count(*) from pg_trigger where tgname in ('clients_00_pause_archive_trg','audit_logs_00_pause_export_trg') and not tgisinternal")"
          [ "$n" = "0" ] || { echo "a guard trigger remains after DOWN"; exit 1; }
          dump "$RUNNER_TEMP/guards-down.sql"
          wc -l "$RUNNER_TEMP"/guards-*.sql

      - name: Control chain WITHOUT the guards (normal full reset through 0246)
        shell: bash
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP"/held/*.sql supabase/migrations/
          ls supabase/migrations | tail -1
          supabase db reset --local
          docker exec -i "$DB" pg_dump -U postgres --schema-only --no-owner --schema=public --schema=auth postgres | grep -vE '^\\(un)?restrict ' > "$RUNNER_TEMP/control.sql"
          wc -l "$RUNNER_TEMP/control.sql"

      - name: Catalog equal after DOWN, and the comparison can see the guards
        shell: bash
        run: |
          set -euo pipefail
          if diff -u "$RUNNER_TEMP/control.sql" "$RUNNER_TEMP/guards-down.sql" > "$RUNNER_TEMP/down.diff"; then
            echo "post-DOWN catalog is IDENTICAL to the control chain"
          else
            head -80 "$RUNNER_TEMP/down.diff"; echo "post-DOWN catalog differs from the control"; exit 1
          fi
          # Control for the comparison itself: with the guards UP it must differ,
          # and the difference must be exactly the guard objects.
          diff -u "$RUNNER_TEMP/control.sql" "$RUNNER_TEMP/guards-up.sql" > "$RUNNER_TEMP/up.diff" && { echo "the comparison cannot see the guards"; exit 1; } || true
          grep -E '^\+' "$RUNNER_TEMP/up.diff" | grep -E 'pause_client_archive_guard|pause_studio_export_guard|clients_00_pause_archive_trg|audit_logs_00_pause_export_trg' | head -20
          echo "UP-vs-control diff size: $(wc -l < "$RUNNER_TEMP/up.diff") lines"
