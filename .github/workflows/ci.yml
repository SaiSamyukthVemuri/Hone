# PR #154. Continuous integration for Hone.
#
# Runs the same validation gates every contributor (and every AI
# agent) is asked to run locally before opening a PR:
#
#   npm ci
#   npm run typecheck
#   npm run lint
#   npm run build
#   npm test
#   git diff --check
#   npm run check:stripe-gates
#
# Triggers:
#   * pull_request (every PR, against any base branch)
#   * push to the default branch claude/build-hone-saas-hOex7
#
# Secrets:
#   * NONE. The job uses dummy/test env values only. See the `env`
#     block below for the rationale on each variable.
#   * No supabase db push. No deploy. No production credentials.

name: ci

on:
  pull_request:
  push:
    branches:
      - claude/build-hone-saas-hOex7

# Cancel in-progress runs for the same ref when a newer commit lands.
# Keeps CI minutes bounded and stops a slow run from blocking the
# next attempt.
concurrency:
  # PR-scoped so a new push to the SAME pull request cancels its superseded run.
  # Nightly/manual concurrency is separate (see nightly.yml).
  group: hone-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Changed-path detection. Runs first; every other lane keys off its outputs.
  # Classification lives in scripts/classify-changes.mjs and is proved by
  # tests/ci/classify-changes.test.ts, so lane selection is verified by unit
  # test rather than by pushing commits to trigger each lane.
  # -------------------------------------------------------------------------
  changes:
    name: changed-path detection
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      application: ${{ steps.classify.outputs.application }}
      database: ${{ steps.classify.outputs.database }}
      security: ${{ steps.classify.outputs.security }}
      payment: ${{ steps.classify.outputs.payment }}
      google_calendar: ${{ steps.classify.outputs.google_calendar }}
      browser_core: ${{ steps.classify.outputs.browser_core }}
      mobile: ${{ steps.classify.outputs.mobile }}
      ci_workflows: ${{ steps.classify.outputs.ci_workflows }}
      full_matrix_required: ${{ steps.classify.outputs.full_matrix_required }}
      browser_run: ${{ steps.browser.outputs.browser_run }}
      browser_extended: ${{ steps.browser.outputs.browser_extended }}
      browser_specs: ${{ steps.browser.outputs.browser_specs }}
      browser_shards: ${{ steps.browser.outputs.browser_shards }}
      browser_reason: ${{ steps.browser.outputs.browser_reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the PR BASE sha is reachable — the diff must be
          # against the merge base, not merely the previous commit, or a
          # multi-commit PR would classify only its most recent push.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect changed files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            MB="$(git merge-base "$BASE" "$HEAD_SHA" 2>/dev/null || echo "$BASE")"
            git diff --name-only "$MB" "$HEAD_SHA" > changed.txt || true
          else
            git show --name-only --pretty=format: "${{ github.sha }}" > changed.txt
          fi
          echo "--- changed files ---"; cat changed.txt

      - name: Classify
        id: classify
        run: node scripts/classify-changes.mjs --files-from changed.txt --github-output

      - name: Select browser groups
        id: browser
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            (async () => {
              const m = await import("./scripts/browser-groups.mjs");
              const files = fs.readFileSync("changed.txt","utf8").split("\n").filter(Boolean);
              const r = m.selectBrowserGroups(files);
              const specs = m.specsForGroups(r.groups);
              const out = [
                `browser_run=${r.groups.length > 0}`,
                `browser_extended=${r.extended}`,
                `browser_specs=${specs ? specs.map(s => "e2e/" + s).join(" ") : ""}`,
                // Extended coverage is split across two SEPARATE JOBS, so each
                // shard gets its own runner and its own Supabase stack. That
                // preserves the isolation the single-worker config protects.
                `browser_shards=${r.extended ? "[1,2,3,4]" : "[1]"}`,
                `browser_reason=${r.reason.replace(/\n/g," ").slice(0,300)}`,
              ].join("\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, out + "\n");
              console.log(out);
            })();
          '

      - name: Plan summary
        run: node scripts/ci-plan.mjs --files "$(paste -sd, changed.txt)" || true


  validate:
    name: typecheck / lint / build / test / safety gates
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    # Dummy / test-safe env values. The build and test harness do not
    # need real Supabase / Stripe / Resend / Twilio / cron credentials
    # to compile or run unit tests. Every value here is shaped to pass
    # the in-app validators (e.g. STRIPE_SECRET_KEY must start with
    # sk_test_ or sk_live_; pk_test_ for publishable; whsec_ prefix
    # for webhook secret). Nothing here is a real secret.
    #
    # Anything that genuinely needs a real secret to run is excluded
    # from CI by design (Stripe Elements canary, real Resend send,
    # real Twilio send, real Supabase prod query). Those live in the
    # manual smoke catalogue in docs/12.
    env:
      NEXT_PUBLIC_APP_ORIGIN: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
      RESEND_API_KEY: "re_dummy_resend_key"
      TWILIO_ACCOUNT_SID: "AC00000000000000000000000000000000"
      TWILIO_AUTH_TOKEN: "dummy-twilio-token"
      TWILIO_FROM_NUMBER: "+15555550100"
      STRIPE_SECRET_KEY: "sk_test_dummy"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_dummy"
      STRIPE_WEBHOOK_SECRET: "whsec_dummy"
      STRIPE_ALLOW_LIVE_MODE: "false"
      CRON_SECRET: "dummy-cron-secret"
      APPOINTMENT_SIGNING_SECRET: "dummy-appointment-signing-secret"
      INTAKE_SIGNING_SECRET: "dummy-intake-signing-secret"
      PORTAL_FINGERPRINT_SALT: "dummy-portal-fingerprint-salt-for-ci"
      ADMIN_EMAILS: "ci@example.com"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # No .nvmrc and no engines.node in package.json today.
          # Pin to Node 20 (LTS), matches the docs/14 fallback and
          # is comfortably within Next 15's supported range.
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Whitespace + conflict-marker check
        # Catches stray trailing whitespace + leftover merge-conflict
        # markers. Matches the manual `git diff --check` step every
        # local PR is asked to run.
        run: git diff --check HEAD

      - name: Stripe / payment safety grep gates
        run: npm run check:stripe-gates

      - name: Migration extension-qualification check
        # Fresh-managed-project fence (RC hardening): every pgcrypto/uuid-ossp call
        # in supabase/migrations must be extensions.<fn>-qualified so the
        # 0001->NNNN chain applies on a FRESH managed project, where `extensions`
        # is NOT on the migration search_path (bare gen_random_bytes -> 42883).
        # Deterministic, Docker-free static scan; gen_random_uuid() built-in is
        # intentionally allowed. Regression fence for the 0025 fresh-apply defect.
        run: npm run check:migration-extensions

  # PR #220. DB/RLS integration lane: applies the FULL migration
  # chain (0001-current) to a throwaway LOCAL Supabase Postgres in
  # the runner and exercises real RLS policies, triggers, claim
  # RPCs, and constraints as the `authenticated` role (tests/db/).
  #
  # Safety:
  #   * No secrets. The only database is the supabase CLI's local
  #     Docker stack on 127.0.0.1; the harness itself refuses any
  #     non-localhost or hosted-looking connection string
  #     (tests/db/helpers/harness.ts), so this job CANNOT be pointed
  #     at production by an env change alone.
  #   * `supabase db reset` runs WITHOUT --linked against the local
  #     stack only. No project ref, no access token, no push.
  #   * Runs as a separate job so the fast unit/static lane above is
  #     untouched; a Docker hiccup here never blocks typecheck/lint.
  db-integration:
    name: db integration (local supabase)
    needs: changes
    if: ${{ needs.changes.outputs.database == 'true' || needs.changes.outputs.security == 'true' || needs.changes.outputs.full_matrix_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, not latest: the CLI version selects the local
          # postgres image, and newer images dropped the baseline
          # default privileges (grant all to anon/authenticated/
          # service_role) that the PRODUCTION project has. With
          # `latest` every authenticated query failed at the grant
          # layer before RLS was consulted (first run of this job).
          # 2.102.0 is the version the harness was verified against
          # locally; bump deliberately and re-verify grants parity.
          version: 2.102.0

      - name: Start local Supabase (DB + REST API)
        # Was `supabase db start` (Postgres only). The DB-integration lane now
        # also exercises server-side code that reaches Supabase over the REST API
        # via createAdminClient() (e.g. the REAL getSessionPaymentEligibility
        # resolver) — that needs kong (54321), not just Postgres (54322). Bring
        # up the same trimmed stack the browser-e2e job uses (proven in CI); the
        # node-pg harness (54322) and `db reset --local` are unaffected.
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,storage-api

      - name: Apply full migration chain from scratch
        # Fails the job if ANY migration 0001-current cannot apply to
        # an empty database, or if any policy/function/trigger SQL
        # fails to compile. This is itself a guarantee no static test
        # could give.
        run: supabase db reset --local

      - name: Fresh-managed extension proof
        # RC hardening: proves the just-migrated local DB matches a FRESH MANAGED
        # project's extension layout — pgcrypto in `extensions`, and with
        # `extensions` OFF the session search_path a BARE pgcrypto call fails
        # (42883) while extensions.<fn> succeeds. Together with the static
        # extension-qualification guard this proves the whole chain (through 0151)
        # applies fresh-managed-like. Runs against the local supabase Postgres only.
        run: npm run check:fresh-managed

      - name: DB/RLS integration tests
        run: npm run test:db

      - name: Generated types drift check
        # PR #221. Regenerates types from the just-migrated LOCAL
        # database (supabase gen types typescript --local) and
        # compares column sets exactly, both directions, against the
        # hand-rolled lib/types/database.ts for every curated table.
        # Local stack only; same safety posture as the steps above.
        run: npm run check:db-types

  # PR #227. Browser E2E lane: ONE browser (Chromium), ONE core flow
  # (the treatment-memory loop: public booking -> intake ->
  # practitioner magic-link login via the local Mailpit-captured
  # email -> charting -> Before Today memory -> Record Keeping
  # filtered print -> anonymous lockout), against a LOCAL Next
  # production build and the LOCAL Supabase stack only.
  #
  # Safety: same posture as db-integration. No secrets (the only
  # keys involved are the public supabase-demo local JWTs and the
  # same dummy provider values the fast lane uses); the harness
  # refuses hosted URLs by construction (e2e/helpers/local-env.ts);
  # no external service is called; live payments stay structurally
  # disabled. Separate job: a flake here never blocks the fast lane.
  browser-e2e-shard:
    # Dynamic name — branch protection must NOT depend on it. The stable
    # required check is the `browser-e2e` aggregator at the end of this file.
    name: browser shard ${{ matrix.shard }} (${{ needs.changes.outputs.browser_extended == 'true' && 'extended' || 'targeted' }})
    needs: changes
    if: ${{ needs.changes.outputs.browser_run == 'true' || needs.changes.outputs.full_matrix_required == 'true' }}
    runs-on: ubuntu-latest
    # HARD TIMEOUT is deliberately ABOVE the performance target, so a job that
    # is merely slow fails loudly on its own terms instead of being cancelled at
    # exactly its target. Run 30767725631 was cancelled at a 10-minute hard
    # timeout while shard 2 had completed 72/90 tests with ZERO failures —
    # a budget problem misreported as a test failure.
    #   targeted  : target ~6 min, hard timeout 10 min
    #   extended  : target <10 min per shard, hard timeout 12 min
    timeout-minutes: ${{ needs.changes.outputs.browser_extended == 'true' && 12 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.changes.outputs.browser_shards) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Same pin and rationale as db-integration (grants parity).
          version: 2.102.0

      - name: Configure local auth for the E2E origin
        # supabase/config.toml is untracked (CLI convention via
        # supabase/.gitignore), so CI materializes the default config
        # and allow-lists the local E2E app origin for the magic-link
        # redirect. Local-only setting; no production project involved.
        run: |
          supabase init --force --with-intellij-settings=false --with-vscode-settings=false >/dev/null 2>&1 || supabase init >/dev/null 2>&1 || true
          test -f supabase/config.toml
          sed -i 's|^site_url = .*|site_url = "http://localhost:3111"|' supabase/config.toml
          sed -i 's|^additional_redirect_urls = .*|additional_redirect_urls = ["http://localhost:3111/**", "http://127.0.0.1:3111/**"]|' supabase/config.toml

      - name: Start local Supabase stack (db + auth + mail capture)
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,storage-api

      - name: Apply full migration chain from scratch
        run: supabase db reset --local

      # Playwright browsers are ~150MB and were previously re-downloaded on
      # every browser job (Chromium + FFmpeg + headless shell). Keyed to the
      # EXACT resolved Playwright version so a dependency bump busts the cache
      # rather than silently reusing incompatible binaries.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        # Browser binaries come from the cache; only OS-level libs are needed.
        run: npx playwright install-deps chromium

      - name: Record setup duration
        id: setup_done
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Browser E2E (${{ needs.changes.outputs.browser_extended == 'true' && 'extended shard' || 'targeted groups' }})
        id: e2e
        run: |
          set -euo pipefail
          echo "reason: ${{ needs.changes.outputs.browser_reason }}"
          if [ "${{ needs.changes.outputs.browser_extended }}" = "true" ]; then
            echo "extended coverage — native Playwright shard ${{ matrix.shard }} of 4"
            npx playwright test --shard=${{ matrix.shard }}/4
          else
            echo "targeted specs: ${{ needs.changes.outputs.browser_specs }}"
            npx playwright test ${{ needs.changes.outputs.browser_specs }}
          fi
        env:
          # Enables the guarded fake-Resend transport for the welcome-email
          # contracts (success / provider-rejection / provider-exception /
          # retry / in-progress, selected per-recipient by owner_email prefix).
          # Server-only marker, refused in any deployed runtime; only the welcome
          # path uses getResendTransport, so all other emails are unaffected.
          HONE_E2E_FAKE_RESEND: "1"

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per-shard so two shards never clobber each other's artifact.
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Timing diagnostics
        if: always()
        run: |
          NOW=$(date +%s)
          SETUP_END=${{ steps.setup_done.outputs.at }}
          echo "shard              : ${{ matrix.shard }}"
          echo "mode               : ${{ needs.changes.outputs.browser_extended == 'true' && 'extended (sharded)' || 'targeted' }}"
          echo "selected specs     : ${{ needs.changes.outputs.browser_specs }}"
          echo "selection reason   : ${{ needs.changes.outputs.browser_reason }}"
          echo "test duration (s)  : $(( NOW - SETUP_END ))"
          echo "job outcome        : ${{ steps.e2e.outcome }}"
          if [ "${{ steps.e2e.outcome }}" = "cancelled" ]; then
            echo "NOTE: cancelled — most likely the job exceeded its timeout budget."
          fi

  # Stable required check. Branch protection points HERE, never at a dynamic
  # shard name. It succeeds only when every required shard succeeded or was
  # legitimately skipped, and fails if any shard failed or was cancelled.
  browser-e2e:
    name: browser e2e (local stack)
    needs: [changes, browser-e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate browser shard results
        env:
          SHARD_RESULT: ${{ needs.browser-e2e-shard.result }}
          BROWSER_RUN: ${{ needs.changes.outputs.browser_run }}
          FULL_MATRIX: ${{ needs.changes.outputs.full_matrix_required }}
          EXTENDED: ${{ needs.changes.outputs.browser_extended }}
          SHARDS: ${{ needs.changes.outputs.browser_shards }}
        run: |
          set -euo pipefail
          REQUIRED="false"
          if [ "$BROWSER_RUN" = "true" ] || [ "$FULL_MATRIX" = "true" ]; then REQUIRED="true"; fi
          EXPECTED=$(node -e 'const s=process.env.SHARDS||"[1]";console.log(JSON.parse(s).length)')

          echo "shard job result : ${SHARD_RESULT:-<missing>}"
          echo "browser required : $REQUIRED"
          echo "extended         : $EXTENDED"
          echo "expected shards  : $EXPECTED"

          # A MISSING result is treated as failure, not success. `needs.<job>.result`
          # is empty only when the matrix job never materialised, which for a
          # required lane means something went wrong upstream.
          if [ -z "${SHARD_RESULT:-}" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error::browser shard result is MISSING while browser coverage was required"
              exit 1
            fi
            echo "no shard result and no browser coverage required — satisfied"
            exit 0
          fi

          if [ "$EXTENDED" = "true" ] && [ "$EXPECTED" -ne 4 ]; then
            echo "::error::extended coverage must run exactly 4 shards, got $EXPECTED"
            exit 1
          fi

          case "$SHARD_RESULT" in
            success)
              echo "all $EXPECTED browser shard(s) passed"
              exit 0 ;;
            skipped)
              if [ "$REQUIRED" = "true" ]; then
                echo "::error::shards were skipped but the diff required browser coverage"
                exit 1
              fi
              echo "no browser coverage required for this diff — satisfied"
              exit 0 ;;
            cancelled)
              # Run 30767725631: shards were cancelled at their hard timeout with
              # zero test failures. That must FAIL the required check, never pass.
              echo "::error::browser shard(s) were CANCELLED (timeout or manual cancel) — treated as failure"
              exit 1 ;;
            *)
              echo "::error::browser shard(s) did not pass (result: $SHARD_RESULT)"
              exit 1 ;;
          esac

  # PR #419. Dedicated payment browser E2E lane. Same LOCAL-only posture as
  # browser-e2e (local Next production build + local Supabase, no secrets, no
  # external service), but this is the ONLY lane that enables the guarded fake
  # Stripe processor: it sets the two server-only markers (HONE_E2E_FAKE_STRIPE=1
  # + a per-job HONE_E2E_RUN_ID) so the fake activation guard passes here and
  # NOWHERE else. No Vercel markers, sk_test_dummy only — so no real charge,
  # refund, email, or SMS can leave this lane. Separate job (own runner) → no
  # port collision with browser-e2e, and a flake here never blocks the fast lane.
  payment-browser-e2e:
    name: payment browser e2e (fake stripe)
    needs: changes
    if: ${{ needs.changes.outputs.payment == 'true' || needs.changes.outputs.full_matrix_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate the per-job fake-Stripe run id
        # ONE validated run id, shared by the Next server + Playwright runner +
        # both ledger sides. Matches the fake-Stripe guard regex
        # (/^[a-z0-9][a-z0-9-]{7,63}$/). Fake Stripe is enabled ONLY in this job.
        run: |
          echo "HONE_E2E_RUN_ID=run-$(openssl rand -hex 6)" >> "$GITHUB_ENV"
          echo "HONE_E2E_FAKE_STRIPE=1" >> "$GITHUB_ENV"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Same pin and rationale as db-integration / browser-e2e (grants parity).
          version: 2.102.0

      - name: Configure local auth for the E2E origin
        # Same local-only auth config as browser-e2e: allow-list the local E2E app
        # origin (port 3111) for the magic-link redirect. No production project.
        run: |
          supabase init --force --with-intellij-settings=false --with-vscode-settings=false >/dev/null 2>&1 || supabase init >/dev/null 2>&1 || true
          test -f supabase/config.toml
          sed -i 's|^site_url = .*|site_url = "http://localhost:3111"|' supabase/config.toml
          sed -i 's|^additional_redirect_urls = .*|additional_redirect_urls = ["http://localhost:3111/**", "http://127.0.0.1:3111/**"]|' supabase/config.toml

      - name: Start local Supabase stack (db + auth + mail capture)
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,storage-api

      - name: Apply full migration chain from scratch
        run: supabase db reset --local

      # Playwright browsers are ~150MB and were previously re-downloaded on
      # every browser job (Chromium + FFmpeg + headless shell). Keyed to the
      # EXACT resolved Playwright version so a dependency bump busts the cache
      # rather than silently reusing incompatible binaries.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        # Browser binaries come from the cache; only OS-level libs are needed.
        run: npx playwright install-deps chromium

      - name: Payment browser E2E (quick checkout, guarded fake Stripe)
        run: npm run test:e2e:payment

      - name: Clean run-scoped fake ledger temp files
        if: always()
        run: rm -f "${TMPDIR:-/tmp}"/hone-e2e-stripe-*.jsonl "${TMPDIR:-/tmp}"/hone-e2e-stripe-*.config.json || true

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payment-playwright-traces
          path: test-results/
          retention-days: 7

  # Mobile-completion E2E (Chloe workflow fix). Runs the mobile-completion
  # journey (in-DOM ConfirmDialog that replaced native window.confirm, optional
  # note, in-place charge) on the CHROMIUM engine at iPhone dimensions (iPhone 13
  # viewport + iOS UA + hasTouch) plus a Pixel 5 control. NOTE: this is Chromium
  # emulation, NOT a real WebKit/iOS-Safari run — the repo E2E harness is
  # hard-wired to plain-http http://localhost, and a real WebKit context upgrades
  # localhost subresources to https (no hydration) + drops Secure cookies over
  # http (auth fails); a real-WebKit lane needs an HTTPS harness (tracked as a
  # follow-up). Same LOCAL-only, guarded-fake-Stripe posture as
  # payment-browser-e2e (HONE_E2E_FAKE_STRIPE=1 + a per-job HONE_E2E_RUN_ID, no
  # Vercel markers, sk_test_dummy) — no real charge/refund/email/SMS/Google can
  # leave the lane; the specs additionally assert zero real provider egress.
  # Separate job (own runner) → no port collision with the other browser lanes.
  mobile-completion-e2e:
    name: mobile completion e2e (chromium iphone-profile)
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' || needs.changes.outputs.full_matrix_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate the per-job fake-Stripe run id
        # ONE validated run id, shared by the Next server + Playwright runner +
        # both ledger sides (matches the fake-Stripe guard regex). Fake Stripe is
        # enabled ONLY in this job and the payment job.
        run: |
          echo "HONE_E2E_RUN_ID=run-$(openssl rand -hex 6)" >> "$GITHUB_ENV"
          echo "HONE_E2E_FAKE_STRIPE=1" >> "$GITHUB_ENV"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Same pin and rationale as the other browser lanes (grants parity).
          version: 2.102.0

      - name: Configure local auth for the E2E origin
        run: |
          supabase init --force --with-intellij-settings=false --with-vscode-settings=false >/dev/null 2>&1 || supabase init >/dev/null 2>&1 || true
          test -f supabase/config.toml
          sed -i 's|^site_url = .*|site_url = "http://localhost:3111"|' supabase/config.toml
          sed -i 's|^additional_redirect_urls = .*|additional_redirect_urls = ["http://localhost:3111/**", "http://127.0.0.1:3111/**"]|' supabase/config.toml

      - name: Start local Supabase stack (db + auth + mail capture)
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,storage-api

      - name: Apply full migration chain from scratch
        run: supabase db reset --local

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-

      - name: Install Playwright Chromium (cache miss)
        # Both projects (iPhone-profile + Pixel 5 control) run on Chromium.
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Mobile completion browser E2E (chromium iphone-profile + control)
        run: npm run test:e2e:mobile

      - name: Clean run-scoped fake ledger temp files
        if: always()
        run: rm -f "${TMPDIR:-/tmp}"/hone-e2e-stripe-*.jsonl "${TMPDIR:-/tmp}"/hone-e2e-stripe-*.config.json || true

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-completion-playwright-traces
          path: test-results/
          retention-days: 7

  # Synthetic Google: sets the two server-only markers (HONE_E2E_FAKE_GOOGLE=1 +
  # a per-job HONE_E2E_RUN_ID) plus a FAKE Google OAuth client, so the fake-Google
  # activation guard passes here and NOWHERE else. No Vercel markers → the guard is
  # fail-closed everywhere else and NO real Google request can leave this lane.
  # Separate job (own runner) → no port collision with the other browser lanes.
  google-browser-e2e:
    name: google browser e2e (fake google)
    needs: changes
    if: ${{ needs.changes.outputs.google_calendar == 'true' || needs.changes.outputs.full_matrix_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate the per-job fake-Google run id
        # ONE validated run id shared by the Next server + Playwright runner +
        # both ledger sides. Matches the fake-Google guard regex
        # (/^[a-z0-9][a-z0-9-]{7,63}$/). Fake Google is enabled ONLY in this job.
        run: |
          echo "HONE_E2E_RUN_ID=run-$(openssl rand -hex 6)" >> "$GITHUB_ENV"
          echo "HONE_E2E_FAKE_GOOGLE=1" >> "$GITHUB_ENV"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Configure local auth for the E2E origin
        run: |
          supabase init --force --with-intellij-settings=false --with-vscode-settings=false >/dev/null 2>&1 || supabase init >/dev/null 2>&1 || true
          test -f supabase/config.toml
          sed -i 's|^site_url = .*|site_url = "http://localhost:3111"|' supabase/config.toml
          sed -i 's|^additional_redirect_urls = .*|additional_redirect_urls = ["http://localhost:3111/**", "http://127.0.0.1:3111/**"]|' supabase/config.toml

      - name: Start local Supabase stack (db + auth + mail capture)
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,storage-api

      - name: Apply full migration chain from scratch
        run: supabase db reset --local

      # Playwright browsers are ~150MB and were previously re-downloaded on
      # every browser job (Chromium + FFmpeg + headless shell). Keyed to the
      # EXACT resolved Playwright version so a dependency bump busts the cache
      # rather than silently reusing incompatible binaries.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        # Browser binaries come from the cache; only OS-level libs are needed.
        run: npx playwright install-deps chromium

      - name: Synthetic Google browser E2E (dual destination, guarded fake Google)
        run: npm run test:e2e:google

      - name: Clean run-scoped fake ledger temp files
        if: always()
        run: rm -f "${TMPDIR:-/tmp}"/hone-e2e-google-*.jsonl "${TMPDIR:-/tmp}"/hone-e2e-google-*.json || true

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: google-playwright-traces
          path: test-results/
          retention-days: 7
