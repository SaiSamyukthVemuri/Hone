# APPLY-TOOL-REHEARSAL. REHEARSAL - NEVER MERGE.
#
# Runs the PROPOSED S1 apply tool and command (pinned Supabase CLI 2.102.0,
# `db push --db-url ...?sslmode=require&options=-c statement_timeout=120000`,
# dry run first) against a DISPOSABLE SYNTHETIC local database built through
# production's migration prefix 0001-0212 -- not a verified copy of production
# data or configuration. No hosted project, no provider, no customer data.
#
# Supply chain as the other workflows: actions pinned by SHA, contents: read,
# persist-credentials: false. The one credential is the D7b read-only ghcr.io
# login, held only across a direct pinned-CLI start, as in ci.yml.

name: apply-tool-rehearsal

on:
  pull_request:
    paths:
      - "scripts/ci/apply-tool-rehearsal.sh"
      - ".github/workflows/apply-tool-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hone-apply-tool-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-tool:
    name: apply tool rehearsal (not required)
    runs-on: ubuntu-latest
    # D7b: read-only package scope for the authenticated ghcr.io image pull only.
    permissions:
      contents: read
      packages: read
    # Stack start, four database resets, the 34-file push, three injected runs and
    # Photos' probes (a 130 s and a 140 s sleep): well inside 60 minutes.
    timeout-minutes: 60
    env:
      EXCLUDE: studio,realtime,edge-runtime,logflare,vector,imgproxy,mailpit,postgres-meta,supavisor
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Pinned Supabase CLI shim (supabase@2.102.0 via npx)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec npx --yes supabase@2.102.0 "$@"\n' > "$RUNNER_TEMP/bin/supabase"
          chmod +x "$RUNNER_TEMP/bin/supabase"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in to ghcr.io for Supabase images (D7b, read-only)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the local Supabase stack (with storage)
        id: sb_start
        continue-on-error: true
        shell: bash
        # public.ecr.aws throttles these pulls ("Data limit exceeded"), so try the
        # ghcr.io mirror first (the credential above applies to it), then the
        # default registry. Either way the pinned CLI starts the same images.
        run: |
          set -o pipefail
          { SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io supabase start -x "$EXCLUDE" \
              || supabase start -x "$EXCLUDE"; } 2>&1 | tee "$RUNNER_TEMP/supabase-start.log"

      - name: Log out of ghcr.io (D7b)
        if: always()
        run: docker logout ghcr.io

      - name: Retry Supabase start once on a port-bind collision (no credential)
        if: steps.sb_start.outcome == 'failure'
        run: bash scripts/ci/supabase-start-bind-retry.sh --after-failed-start "$RUNNER_TEMP/supabase-start.log" supabase start -x "$EXCLUDE"

      - name: Rehearse the proposed S1 apply tool
        shell: bash
        env:
          REHEARSAL_OUT: ${{ runner.temp }}/apply-tool-out
        run: |
          set -u
          export DB="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -1)"
          echo "db container: $DB"
          bash scripts/ci/apply-tool-rehearsal.sh

      - name: Upload rehearsal logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apply-tool-rehearsal-logs
          path: ${{ runner.temp }}/apply-tool-out/
          retention-days: 7
