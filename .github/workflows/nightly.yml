name: nightly full matrix

# The complete matrix. PR CI is risk-based (see ci.yml + scripts/classify-changes.mjs)
# and runs only the lanes a diff can affect; this workflow is where the FULL
# coverage lives so nothing is lost. It is moved, not weakened.
#
# Runs:
#   * nightly on a schedule
#   * on demand via workflow_dispatch (use this before a deliberate release
#     candidate, or to re-validate a PR whose risk classification you doubt)

on:
  schedule:
    # 07:00 UTC daily: after the existing 09:00/09:30 UTC calendar crons would
    # otherwise contend, and before a working day starts in North America.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual full matrix is being run (recorded in the run)"
        required: false
        default: "manual full-matrix validation"

# CI-HARDEN-01B. Least privilege, asserted rather than assumed.
#
# Neither workflow uses GITHUB_TOKEN, reads a secret, pushes a commit, tags,
# comments, or calls a GitHub write API: every job checks out, builds and tests.
# The default token scope was therefore wider than anything here needs, so read
# is the whole requirement. That is verified rather than assumed - see the guard
# in tests/ci/ci-config.test.ts, which asserts it over step text with comment
# lines stripped, because this block's own rationale names GITHUB_TOKEN.
#
# Cache restore and artifact upload are unaffected: both authenticate with the
# Actions runtime token, not GITHUB_TOKEN.
#
# Codex exact-head review deliberately does NOT run here. scripts/eng/* reads
# GitHub with the operator's credential; putting it in a workflow would require
# this workflow to hold an API credential, which is exactly what this block
# removes. It stays operator-side: `npm run eng -- status <pr>`.
#
# A future workflow that genuinely writes to GitHub declares its own JOB-LEVEL
# `permissions:` rather than widening this one.
permissions:
  contents: read

# A newer nightly supersedes an in-flight one; never burn minutes on a stale run.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-matrix:
    name: full matrix (${{ matrix.lane }})
    runs-on: ubuntu-latest
    # D7b: read-only package scope for the authenticated ghcr.io image pull only.
    permissions:
      contents: read
      packages: read
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One lane failing must not hide the others: the nightly's job is to tell
      # you everything that is broken, not the first thing.
      fail-fast: false
      matrix:
        include:
          - lane: "typecheck / lint / build / unit / safety gates"
            command: "npm run typecheck && npm run lint && npm run build && npm test && npm run check:stripe-gates && npm run check:migration-extensions"
            needs_supabase: false
            needs_browsers: false
            timeout: 25
          - lane: "full migration chain + db/rls integration"
            command: "npm run test:db"
            needs_supabase: true
            needs_browsers: false
            timeout: 30
          # Browser ceilings are FAILURE CEILINGS sized to setup plus tests, not
          # targets. Each shard runs the same quarter of the full suite as ci.yml's
          # extended shard, so it gets the same 25; payment matches ci.yml's 18.
          # At 15, runs 39602074266 and 39781365862 cancelled shards 1 and 3 and
          # google at the ceiling with no assertion failure (google spent 12 of
          # its 15 minutes before the lane step started).
          - lane: "core browser e2e (shard 1/4)"
            command: "npx playwright test --shard=1/4"
            needs_supabase: true
            needs_browsers: true
            timeout: 25
          - lane: "core browser e2e (shard 2/4)"
            command: "npx playwright test --shard=2/4"
            needs_supabase: true
            needs_browsers: true
            timeout: 25
          - lane: "core browser e2e (shard 3/4)"
            command: "npx playwright test --shard=3/4"
            needs_supabase: true
            needs_browsers: true
            timeout: 25
          - lane: "core browser e2e (shard 4/4)"
            command: "npx playwright test --shard=4/4"
            needs_supabase: true
            needs_browsers: true
            timeout: 25
          - lane: "payment e2e (fake stripe)"
            command: "npm run test:e2e:payment"
            needs_supabase: true
            needs_browsers: true
            timeout: 18
          - lane: "mobile completion e2e"
            command: "npm run test:e2e:mobile"
            needs_supabase: true
            needs_browsers: true
            timeout: 15
          - lane: "google e2e (fake google)"
            command: "npm run test:e2e:google"
            needs_supabase: true
            needs_browsers: true
            timeout: 18

    env:
      # TEST-PORT-01: pin the historical port so the nightly matrix is unaffected
      # by the per-worktree derivation used on developer machines.
      HONE_E2E_PORT: "3111"
      NEXT_PUBLIC_APP_ORIGIN: "http://localhost:3111"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
      RESEND_API_KEY: "re_dummy_resend_key"
      STRIPE_SECRET_KEY: "sk_test_dummy"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_dummy"
      STRIPE_WEBHOOK_SECRET: "whsec_dummy"
      CRON_SECRET: "dummy-cron-secret"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # CI-HARDEN-01B. The checkout credential is not left behind for the rest
        # of the job. Nothing here needs it: every git call in these workflows is
        # LOCAL to the history checkout already fetched (merge-base, diff, show,
        # diff --check). No job pushes, tags, comments or calls a write API, so a
        # usable token sitting on disk for the remainder of the run buys nothing
        # and widens what a compromised later step could reach.
        #
        # NOT redundant with the action default: persist-credentials still
        # defaults to TRUE in actions/checkout v7.0.1, verified in its action.yml
        # at this exact SHA.
        with:
          persist-credentials: false
          # The unit lane's canonical production-record checks need history and
          # the production ref; shallow, they passed by asserting they could
          # not run (#825 6215529089).
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          cache: "npm"

      # Supabase is only started for lanes that need a database. The DB-less
      # lane skips several minutes of container startup entirely.
      - name: Start local Supabase
        if: matrix.needs_supabase
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # CI-HARDEN-01B. Pinned to a COMMIT, not to `v1`: `v1` is a BRANCH in
          # supabase/setup-cli (refs/heads/v1), not a tag - that repository's
          # tags run v1.7.1 -> v2.0.0 -> v3 - so every DB-touching job here
          # executed whatever that branch pointed at. ab058987 == tag v1.7.1.
          #
          # NOT bumped to v3: v3 is a COMPOSITE action that installs the CLI
          # from npm via Bun, with different `version` semantics. The 2.102.0
          # pin below is a grants-parity DB-safety invariant; a major bump is a
          # separate ticket with its own grants re-verification.
          # Pinned deliberately: a newer CLI's `db reset` strips Data-API grants
          # and every authenticated query then fails at the privilege layer,
          # which looks exactly like an application bug. Bump only with a
          # grants-parity re-verification.
          version: 2.102.0

      # D7b (Sam, 2026-10-22, option A). Anonymous pulls were throttled on BOTH
      # ghcr.io ("toomanyrequests") and public.ecr.aws ("Data limit exceeded") for
      # parallel Supabase stacks. Pull the CLI's default ghcr.io images
      # AUTHENTICATED with the job's own read-only token: this job alone declares
      # packages: read; nothing here can write. The ONE sanctioned credential use
      # in these workflows, pinned by tests/ci/ci-config.test.ts.
      - name: Log in to ghcr.io for Supabase images (D7b, read-only)
        if: matrix.needs_supabase
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI-REGISTRY (OPS, 2026-10-27; supply-chain fixes from Insurance PEER-1200-SUPPLY).
      # The D7b login succeeds, then the stack start pulls ~10 images at once and
      # ghcr.io answers "toomanyrequests ... allowed: 44000/minute" (a short burst
      # throttle across parallel jobs); docker and the CLI do not retry, and the
      # bind-retry step correctly refuses (not a port collision). Mechanism from
      # Team's proven rehearsal (#1193, run 40552718991): pull each image ahead of
      # the start with a bounded back-off and a registry fallback, so the start finds
      # it locally. The list is the pinned CLI's OWN image list (the embedded
      # Dockerfile, sibling supabase-go), for this job's exact -x set plus
      # postgres, realtime and storage-api, which the start pulls while initialising
      # the database even when excluded (runs 40557844633, 40559826388, 40562452255).
      # EVERY pull is BY DIGEST from the committed, reviewed table
      # .github/supabase-image-digests.json (generated from ghcr.io/supabase for CLI
      # 2.102.0); an image is tagged ghcr.io/supabase/<name>:<tag> only after its
      # digest is confirmed, an unverified pull is removed and never tagged, an image
      # missing from the table (or a CLI version other than the table's) is left to
      # the start, and vector/logflare (vector mounts the Docker socket) never use a
      # fallback. Inline, never a checked-out script, because the credential is held
      # (Codex P2 4354172124); the table is read as data. Non-fatal: the start still
      # pulls what is missing, and a start that fails still fails the job.
      - name: Pre-pull Supabase images (bounded back-off; ghcr, then ECR or Docker Hub, by digest)
        if: matrix.needs_supabase
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          EXCLUDE=''
          TABLE=.github/supabase-image-digests.json
          cli_v="$(supabase --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if ! command -v jq > /dev/null 2>&1 || [ ! -r "$TABLE" ] || [ "$cli_v" != "$(jq -r '.cli' "$TABLE")" ]; then
            echo "::warning title=Supabase image pre-pull skipped::no digest table for CLI '$cli_v' (or no jq); the stack start pulls as before."
            exit 0
          fi
          pooler_on="$(awk '/^\[db\.pooler\]/{f=1;next} /^\[/{f=0} f && /^enabled *= *true/{print "yes"}' supabase/config.toml 2>/dev/null)"
          BIN="$(command -v supabase || true)"
          : > "$RUNNER_TEMP/cli-images.txt"
          for cand in "$(dirname "$(readlink -f "$BIN")")/supabase-go" "$BIN"; do
            [ -r "$cand" ] || continue
            grep -a -oE '^FROM [A-Za-z0-9_./:-]+ AS (pg|kong|gotrue|postgrest|realtime|storage|imgproxy|edgeruntime|studio|pgmeta|logflare|vector|mailpit|supavisor)$' "$cand" | sort -u > "$RUNNER_TEMP/cli-images.txt"
            [ -s "$RUNNER_TEMP/cli-images.txt" ] && break
          done
          : > "$RUNNER_TEMP/pull-list.txt"
          if [ ! -s "$RUNNER_TEMP/cli-images.txt" ]; then
            echo "::warning title=Supabase image pre-pull skipped::the CLI's embedded image list was not readable; the stack start pulls as before."
            exit 0
          fi
          while read -r _from image _as alias; do
            case "$alias" in pg) svc=postgres ;; storage) svc=storage-api ;; edgeruntime) svc=edge-runtime ;; pgmeta) svc=postgres-meta ;; *) svc="$alias" ;; esac
            case "$svc" in
              postgres|realtime|storage-api) ;;
              supavisor) [ -n "$pooler_on" ] || continue; case ",$EXCLUDE," in *",$svc,"*) continue ;; esac ;;
              *) case ",$EXCLUDE," in *",$svc,"*) continue ;; esac ;;
            esac
            printf '%s %s\n' "${image##*/}" "$image" >> "$RUNNER_TEMP/pull-list.txt"
          done < "$RUNNER_TEMP/cli-images.txt"
          echo "images: $(awk '{print $1}' "$RUNNER_TEMP/pull-list.txt" | tr '\n' ' ')"
          from_ghcr=0; from_fallback=""; missing=""
          while read -r IMG ORIG; do
            NAME="${IMG%%:*}"
            D="$(jq -r --arg k "$IMG" '.images[$k] // empty' "$TABLE")"
            if [ -z "$D" ]; then
              echo "::warning title=Supabase image pre-pull::$IMG is not in the digest table; left to the stack start."
              missing="$missing $IMG"; continue
            fi
            ref=""; via=""
            for i in 1 2; do
              if docker pull -q "ghcr.io/supabase/$NAME@$D" > /dev/null 2>&1; then ref="ghcr.io/supabase/$NAME@$D"; via=ghcr; break; fi
              echo "ghcr pull of $IMG refused (attempt $i)"; sleep $((i*15))
            done
            if [ -z "$ref" ]; then
              case "$NAME" in
                vector|logflare) echo "no fallback for $NAME: it runs with the Docker socket; left to the stack start" ;;
                *)
                  for base in public.ecr.aws/supabase/$NAME docker.io/supabase/$NAME ${ORIG:+docker.io/${ORIG%%:*}}; do
                    if docker pull -q "$base@$D" > /dev/null 2>&1; then
                      if docker image inspect --format '{{json .RepoDigests}}' "$base@$D" 2> /dev/null | grep -q "@$D"; then ref="$base@$D"; via="$base"; break; fi
                      echo "::warning title=Supabase image pre-pull::$base@$D did not report digest $D; discarded, not tagged."
                      docker rmi "$base@$D" > /dev/null 2>&1
                    fi
                  done ;;
              esac
            fi
            if [ -n "$ref" ] && docker tag "$ref" "ghcr.io/supabase/$IMG"; then
              if [ "$via" = ghcr ]; then from_ghcr=$((from_ghcr + 1)); else from_fallback="$from_fallback $IMG($via)"; echo "using $via for $IMG by digest $D, re-tagged locally"; fi
            else
              echo "::warning title=Supabase image pre-pull::$IMG could not be pulled and verified from ghcr, ECR or Docker Hub; left to the stack start."
              missing="$missing $IMG"
            fi
          done < "$RUNNER_TEMP/pull-list.txt"
          echo "pre-pull summary: $from_ghcr from ghcr; fallback by digest:${from_fallback:- none}; left to the start:${missing:- none}"

      - name: Bring up the database
        id: sb_start
        if: matrix.needs_supabase
        # Direct pinned-CLI call while the ghcr.io credential is held: no
        # checked-out script runs before the logout (Codex P2 4354172124).
        # A failure falls through to the credential-free retry step below.
        continue-on-error: true
        shell: bash
        run: supabase start 2>&1 | tee "$RUNNER_TEMP/supabase-start.log"

      # Codex P2 4353990804: drop the registry credential the moment the
      # images are pulled, before ANY later step runs branch-controlled code.
      # always(): a failed start must not leave the token behind either.
      - name: Log out of ghcr.io (D7b)
        if: always() && matrix.needs_supabase
        run: docker logout ghcr.io

      - name: Retry Supabase start once on a port-bind collision (no credential)
        if: matrix.needs_supabase && steps.sb_start.outcome == 'failure'
        run: bash scripts/ci/supabase-start-bind-retry.sh --after-failed-start "$RUNNER_TEMP/supabase-start.log" supabase start

      - name: Install dependencies
        run: npm ci

      # Browsers are only fetched for the lanes that actually drive one, and the
      # download is cached across runs.
      - name: Resolve Playwright version
        id: pw
        if: matrix.needs_browsers
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        if: matrix.needs_browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-

      - name: Install Playwright browsers (cache miss)
        if: matrix.needs_browsers && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # System packages: cached per runner image + Playwright version and
      # bounded, exactly as in ci.yml's four Playwright jobs (CLAUDE.md section
      # 4; 2026-10-23 apt stall). The save runs straight after the install, not
      # in a post step that a failed or cancelled lane would skip.
      - name: Resolve runner image
        id: img
        if: matrix.needs_browsers
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright system packages (.deb)
        id: deb-cache
        if: matrix.needs_browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: pw-debs-${{ steps.img.outputs.id }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright system packages (bounded, .deb cache)
        if: matrix.needs_browsers
        timeout-minutes: 6
        run: bash scripts/ci/playwright-system-deps.sh

      - name: Save Playwright system packages (.deb)
        if: matrix.needs_browsers && steps.deb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: pw-debs-${{ steps.img.outputs.id }}-${{ steps.pw.outputs.version }}

      - name: Run lane
        run: ${{ matrix.command }}
        env:
          # The nightly production check ENFORCES canonical freshness (A3/A5).
          CANONICAL_FRESHNESS: enforce

      # Traces are large; upload them only when there is a failure to inspect.
      - name: Upload traces on failure
        if: failure() && matrix.needs_browsers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traces-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
