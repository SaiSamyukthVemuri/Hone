# REHEARSAL - NEVER MERGE. Proves the two 0248-only window variants (window-s0a-0248, window-s1read-0248) OFFLINE: the generator is deterministic, both scripts
# parse, the comparator variant and the read-back verdict program are exercised on synthetic fixtures with negative controls. No hosted call, no credential, no database.
name: window-0248-rehearsal

on:
  pull_request:
    paths:
      - "rehearsal/window-0248/**"
      - ".github/workflows/window-0248-rehearsal.yml"

permissions:
  contents: read

jobs:
  variants:
    name: window-s0a-0248 and window-s1read-0248 (offline proof)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: |
          node --version
          python3 --version
      - name: Generator equality, parse checks and the offline tests
        run: bash rehearsal/window-0248/check.sh

  chain:
    name: the SQL of both variants against a real schema (fresh local database at 0246, then the sealed 0248)
    runs-on: ubuntu-latest
    # D7b: read-only package scope for the authenticated ghcr.io image pull only.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 40
    env:
      # Only the database image is needed: fewer images means less exposure to the registry throttle that ended earlier MAC-PATH runs.
      EXCLUDE: studio,realtime,edge-runtime,logflare,vector,imgproxy,mailpit,postgres-meta,gotrue,postgrest,storage-api,kong
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Pinned Supabase CLI shim (supabase@2.102.0 via npx)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec npx --yes supabase@2.102.0 "$@"\n' > "$RUNNER_TEMP/bin/supabase"
          chmod +x "$RUNNER_TEMP/bin/supabase"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Log in to ghcr.io for Supabase images (D7b, read-only)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the local database (applies the repository chain 0001..0246)
        id: sb_start
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rc=1
          for attempt in 1 2 3; do
            { SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io supabase start -x "$EXCLUDE" \
                || supabase start -x "$EXCLUDE"; } 2>&1 | tee "$RUNNER_TEMP/supabase-start.log"
            rc=${PIPESTATUS[0]}
            [ "$rc" = 0 ] && break
            grep -q 'toomanyrequests' "$RUNNER_TEMP/supabase-start.log" || break
            echo "attempt $attempt throttled; waiting 120 s"; supabase stop --no-backup > /dev/null 2>&1 || true; sleep 120
          done
          exit "$rc"
      - name: Log out of ghcr.io (D7b)
        if: always()
        run: docker logout ghcr.io
      - name: Retry Supabase start once on a port-bind collision (no credential)
        if: steps.sb_start.outcome == 'failure'
        run: bash scripts/ci/supabase-start-bind-retry.sh --after-failed-start "$RUNNER_TEMP/supabase-start.log" supabase start -x "$EXCLUDE"
      - name: Run both variants' SQL on the real schema, with a rogue-definer parity control
        shell: bash
        run: |
          set -o pipefail
          export DB="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -1)"
          echo "db container: $DB"
          bash rehearsal/window-0248/chain-proof.sh 2>&1 | tee "$RUNNER_TEMP/chain-proof.txt"; exit ${PIPESTATUS[0]}
