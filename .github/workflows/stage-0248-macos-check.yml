# REHEARSAL - NEVER MERGE. ONE macOS execution of rehearsal/s1-script/stage-0248/check.sh at the exact head of PR #1193 (80527bf5): BSD date/find/touch/sed, bash 3.2, shasum.
# The tree under test is #1193's, not this branch's. check.sh is a Linux CI harness: the three GNU tools it uses for ITS OWN bookkeeping (sha256sum, sed -i with no suffix) are
# provided by shims in a directory placed on PATH, and `bash` is pinned to /bin/bash (3.2). The gate text under test is never shimmed: check.sh itself asserts that text avoids those tools.
# No hosted access, no database, no credential.
name: stage-0248-macos-check

on:
  pull_request:
    paths:
      - ".github/workflows/stage-0248-macos-check.yml"

permissions:
  contents: read

jobs:
  macos:
    name: stage-0248/check.sh on macOS arm64 (/bin/bash 3.2, BSD tools) at #1193 80527bf5
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout the #1193 head, pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 80527bf56e18271ed0c91ccb11b01d0961f04721
          persist-credentials: false
      - name: Platform facts
        run: |
          set -u
          test "$(git rev-parse HEAD)" = 80527bf56e18271ed0c91ccb11b01d0961f04721
          uname -sm; sw_vers -productVersion
          /bin/bash --version | head -1
          echo "bash on PATH: $(command -v bash) $(bash -c 'echo $BASH_VERSION')"
          for t in sha256sum shasum python3 node date find touch sed; do printf '%-10s %s\n' "$t" "$(command -v $t || echo MISSING)"; done
          date --version 2>&1 | head -1 || true
      - name: Harness shims (check.sh's own bookkeeping only) and bash 3.2 first on PATH
        run: |
          set -eu
          S="$RUNNER_TEMP/shims"; mkdir -p "$S"
          ln -s /bin/bash "$S/bash"
          printf '#!/bin/sh\nexec /usr/bin/shasum -a 256 "$@"\n' > "$S/sha256sum"
          # GNU 'sed -i EXPR FILE' -> BSD 'sed -i "" EXPR FILE'; every other use passes through
          printf '#!/bin/sh\nif [ "${1:-}" = "-i" ]; then shift; exec /usr/bin/sed -i "" "$@"; fi\nexec /usr/bin/sed "$@"\n' > "$S/sed"
          chmod +x "$S/sha256sum" "$S/sed"
          echo "$S" >> "$GITHUB_PATH"
      - name: check.sh under /bin/bash 3.2
        run: |
          echo "bash now: $(command -v bash) $(bash -c 'echo $BASH_VERSION')"
          /bin/bash rehearsal/s1-script/stage-0248/check.sh 2>&1 | tee "$RUNNER_TEMP/stage0248-macos.txt"; exit ${PIPESTATUS[0]}
