# REHEARSAL - NEVER MERGE. PREPARATION ONLY / HELD: MULTI-STAGE-BUILDER. rehearsal/multi-stage/build.py turns an ORDERED list of migration files into one reviewed online stage package
# per step (package P1: 0254, 0258, 0272, 0266, 0271) and every valid drop of a step, pre-built (stage-drop rules). (1) seq: the GENERATED apply, reconcile and read-back scripts run as REAL TEXT, stage after stage, against a STATEFUL stub supabase-go
# (a file-backed remote history that follows the real CLI's --include-all rule), a FIFO terminal, canary secrets and a fake HOME, with negative controls (extra file, missing file, wrong sha,
# out-of-order step, failure injected at step k: history stops at k-1 and the next step refuses). (2) push: the real pinned CLI v2.102.0 against a disposable PostgreSQL, one invocation per
# migration, the same negative controls, and a two-file push that cannot be rolled back. No hosted call, no customer data, no credential beyond a throwaway canary password.
name: rehearsal-multi-stage-builder

on:
  pull_request:
    paths:
      - "rehearsal/multi-stage/**"
      - "scripts/ci/multi-stage-push-rehearsal.sh"
      - "scripts/ci/gate-pack-stack-rehearsal.sh"
      - ".github/workflows/rehearsal-multi-stage-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seq-macos:
    name: MULTI-STAGE sequence on macOS arm64 (/bin/bash 3.2, launched from zsh like the operator's terminal)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build package P1 (0254, 0258, 0272, 0266, 0271 and every valid drop)
        shell: bash
        run: |
          python3 --version
          python3 rehearsal/multi-stage/build.py rehearsal/multi-stage/spec/p1.json "$RUNNER_TEMP/ms-pkg"
          cat "$RUNNER_TEMP/ms-pkg/SEQUENCE.md"
          # the v1 (P1) package describes the hosted set BEFORE 0254 was applied; the production tree now carries 0254, so the 247-file hosted view leaves it out
          mkdir -p "$RUNNER_TEMP/hosted247" && cp supabase/migrations/*.sql "$RUNNER_TEMP/hosted247/" && rm -f "$RUNNER_TEMP"/hosted247/0254_*.sql
      - name: Sequence, negative controls and failure injection (N of N)
        shell: /bin/zsh {0}
        run: |
          /bin/bash rehearsal/multi-stage/seq-check.sh "$RUNNER_TEMP/ms-pkg" "$RUNNER_TEMP/hosted247" full 2>&1 | tee "$RUNNER_TEMP/seq-macos.txt"; rc=${pipestatus[1]}
          exit $rc
      - name: A dropped step (0266 dropped), the whole sequence, no rebuild
        shell: /bin/zsh {0}
        run: |
          ONLY_A=1 /bin/bash rehearsal/multi-stage/seq-check.sh "$RUNNER_TEMP/ms-pkg" "$RUNNER_TEMP/hosted247" drop-0266 2>&1 | tee "$RUNNER_TEMP/seq-macos-drop.txt"; rc=${pipestatus[1]}
          exit $rc

  seq-linux:
    name: MULTI-STAGE builder checks and sequence on Linux (bash 5)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build package P1 (0254, 0258, 0272, 0266, 0271 and every valid drop)
        shell: bash
        run: |
          python3 --version
          python3 rehearsal/multi-stage/build.py rehearsal/multi-stage/spec/p1.json "$RUNNER_TEMP/ms-pkg"
          cat "$RUNNER_TEMP/ms-pkg/SEQUENCE.md"
          # the v1 (P1) package describes the hosted set BEFORE 0254 was applied; the production tree now carries 0254, so the 247-file hosted view leaves it out
          mkdir -p "$RUNNER_TEMP/hosted247" && cp supabase/migrations/*.sql "$RUNNER_TEMP/hosted247/" && rm -f "$RUNNER_TEMP"/hosted247/0254_*.sql
      - name: Builder checks (refusals, determinism, content-gate flags)
        run: |
          set -o pipefail
          bash rehearsal/multi-stage/builder-check.sh rehearsal/multi-stage/spec/p1.json 2>&1 | tee "$RUNNER_TEMP/builder-linux.txt"
      - name: Sequence, negative controls and failure injection (N of N)
        run: |
          set -o pipefail
          bash rehearsal/multi-stage/seq-check.sh "$RUNNER_TEMP/ms-pkg" "$RUNNER_TEMP/hosted247" full 2>&1 | tee "$RUNNER_TEMP/seq-linux.txt"
      - name: Every other valid plan (a step dropped without a rebuild)
        run: |
          set -o pipefail
          for q in $(python3 -c "import json,sys;print(' '.join(k for k in json.load(open(sys.argv[1]))['sequences'] if k != 'full'))" "$RUNNER_TEMP/ms-pkg/PLAN.json"); do
            echo "=========== sequence $q"
            ONLY_A=1 bash rehearsal/multi-stage/seq-check.sh "$RUNNER_TEMP/ms-pkg" "$RUNNER_TEMP/hosted247" "$q" 2>&1 | tee -a "$RUNNER_TEMP/seq-linux-drops.txt" | tail -3
          done
          ! grep -q "^FAIL" "$RUNNER_TEMP/seq-linux-drops.txt"
      - name: Package P1X (the optional 0253, 0255, 0256 added, 111 stage packages and 96 sequences), builder checks and a sample of sequences
        run: |
          set -o pipefail
          python3 rehearsal/multi-stage/build.py rehearsal/multi-stage/spec/p1x.json "$RUNNER_TEMP/ms-pkgx" | tee "$RUNNER_TEMP/p1x.txt"
          GENERIC_ONLY=1 bash rehearsal/multi-stage/builder-check.sh rehearsal/multi-stage/spec/p1x.json 2>&1 | tee "$RUNNER_TEMP/builder-p1x.txt"
          for q in full drop-0253 drop-0253+0255+0256 drop-0254+0253+0255+0256 drop-0258+0272+0266 drop-0258+0272+0266+0271; do
            echo "=========== P1X sequence $q"
            ONLY_A=1 bash rehearsal/multi-stage/seq-check.sh "$RUNNER_TEMP/ms-pkgx" "$RUNNER_TEMP/hosted247" "$q" 2>&1 | tee -a "$RUNNER_TEMP/seq-p1x.txt" | tail -3
          done
          ! grep -q "^FAIL" "$RUNNER_TEMP/seq-p1x.txt" "$RUNNER_TEMP/builder-p1x.txt"

      - name: Package P2 (P1 v2, the real 0258, 0272, 0266, 0271 on the hosted set AFTER 0254), builder checks and every valid plan
        run: |
          set -o pipefail
          python3 rehearsal/multi-stage/build.py rehearsal/multi-stage/spec/p2.json "$RUNNER_TEMP/ms-p2" | tee "$RUNNER_TEMP/p2.txt"
          GENERIC_ONLY=1 bash rehearsal/multi-stage/builder-check.sh rehearsal/multi-stage/spec/p2.json 2>&1 | tee "$RUNNER_TEMP/builder-p2.txt"
          mkdir "$RUNNER_TEMP/hosted248" && cp supabase/migrations/*.sql "$RUNNER_TEMP/hosted248/" && cp rehearsal/multi-stage/spec/sealed/0254_perm_hon44_role_enforcement.sql "$RUNNER_TEMP/hosted248/"
          for q in $(python3 -c "import json,sys;print(' '.join(json.load(open(sys.argv[1]))['sequences']))" "$RUNNER_TEMP/ms-p2/PLAN.json"); do
            echo "=========== P2 sequence $q"
            ONLY_A=1 bash rehearsal/multi-stage/seq-check.sh "$RUNNER_TEMP/ms-p2" "$RUNNER_TEMP/hosted248" "$q" 2>&1 | tee -a "$RUNNER_TEMP/seq-p2.txt" | tail -3
          done
          python3 rehearsal/multi-stage/build.py rehearsal/multi-stage/spec/p256.json "$RUNNER_TEMP/ms-p256" | tee "$RUNNER_TEMP/p256.txt"
          GENERIC_ONLY=1 bash rehearsal/multi-stage/builder-check.sh rehearsal/multi-stage/spec/p256.json 2>&1 | tee "$RUNNER_TEMP/builder-p256.txt"
          for q in full drop-0256; do
            echo "=========== P256 sequence $q"
            ONLY_A=1 bash rehearsal/multi-stage/seq-check.sh "$RUNNER_TEMP/ms-p256" "$RUNNER_TEMP/hosted248" "$q" 2>&1 | tee -a "$RUNNER_TEMP/seq-p256.txt" | tail -3
          done
          ! grep -q "^FAIL" "$RUNNER_TEMP/seq-p2.txt" "$RUNNER_TEMP/builder-p2.txt" "$RUNNER_TEMP/seq-p256.txt" "$RUNNER_TEMP/builder-p256.txt"

  push-linux:
    name: MULTI-STAGE push, real CLI v2.102.0, disposable PostgreSQL (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build package P1 (0254, 0258, 0272, 0266, 0271 and every valid drop)
        shell: bash
        run: |
          python3 --version
          python3 rehearsal/multi-stage/build.py rehearsal/multi-stage/spec/p1.json "$RUNNER_TEMP/ms-pkg"
          cat "$RUNNER_TEMP/ms-pkg/SEQUENCE.md"
      - name: Start the runner's PostgreSQL with a throwaway canary password
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do sudo -u postgres psql -Atc 'select 1' > /dev/null 2>&1 && break; sleep 1; done
          sudo -u postgres psql -c "alter user postgres with password 'postgres'"
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable" -Atc 'select version()'
      - name: Rehearse the ordered pushes
        shell: bash
        env:
          REHEARSAL_OUT: ${{ runner.temp }}/ms-push-out
        run: |
          bash scripts/ci/multi-stage-push-rehearsal.sh "$RUNNER_TEMP/ms-pkg" full
          for q in $(python3 -c "import json,sys;print(' '.join(k for k in json.load(open(sys.argv[1]))['sequences'] if k != 'full'))" "$RUNNER_TEMP/ms-pkg/PLAN.json"); do
            REHEARSAL_OUT="$RUNNER_TEMP/ms-push-out/$q" ONLY_A=1 bash scripts/ci/multi-stage-push-rehearsal.sh "$RUNNER_TEMP/ms-pkg" "$q" | tail -2
          done
      - name: Upload rehearsal logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-stage-push-linux-logs
          path: ${{ runner.temp }}/ms-push-out/
          retention-days: 7

  push-macos:
    name: MULTI-STAGE push, the macOS CLI binary the operator runs, disposable PostgreSQL (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build package P1 (0254, 0258, 0272, 0266, 0271 and every valid drop)
        shell: bash
        run: |
          python3 --version
          python3 rehearsal/multi-stage/build.py rehearsal/multi-stage/spec/p1.json "$RUNNER_TEMP/ms-pkg"
          cat "$RUNNER_TEMP/ms-pkg/SEQUENCE.md"
      - name: Start a local PostgreSQL with a throwaway canary password
        shell: bash
        run: |
          set -euo pipefail
          brew install postgresql@16
          brew services start postgresql@16
          PGBIN="$(brew --prefix postgresql@16)/bin"; echo "$PGBIN" >> "$GITHUB_PATH"
          for _ in $(seq 1 40); do "$PGBIN/psql" -d postgres -Atc 'select 1' > /dev/null 2>&1 && break; sleep 1; done
          "$PGBIN/psql" -d postgres -c "create role postgres superuser login password 'postgres'"
          # the CLI's connection insists on TLS here: give the throwaway server a self-signed certificate
          PGDATA="$("$PGBIN/psql" -d postgres -Atc 'show data_directory')"
          openssl req -new -x509 -days 2 -nodes -text -out "$PGDATA/server.crt" -keyout "$PGDATA/server.key" -subj "/CN=localhost"
          chmod 600 "$PGDATA/server.key"
          "$PGBIN/psql" -d postgres -c "alter system set ssl = on"
          brew services restart postgresql@16
          for _ in $(seq 1 40); do "$PGBIN/psql" -d postgres -Atc 'select 1' > /dev/null 2>&1 && break; sleep 1; done
          "$PGBIN/psql" -d postgres -Atc 'show ssl'
          PGPASSWORD=postgres "$PGBIN/psql" "postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable" -Atc 'select version()'
      - name: Rehearse the ordered pushes
        shell: bash
        env:
          REHEARSAL_OUT: ${{ runner.temp }}/ms-push-out
        run: |
          bash scripts/ci/multi-stage-push-rehearsal.sh "$RUNNER_TEMP/ms-pkg" full
          REHEARSAL_OUT="$RUNNER_TEMP/ms-push-out/drop-0266" ONLY_A=1 bash scripts/ci/multi-stage-push-rehearsal.sh "$RUNNER_TEMP/ms-pkg" drop-0266
      - name: Upload rehearsal logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-stage-push-macos-logs
          path: ${{ runner.temp }}/ms-push-out/
          retention-days: 7

  gates-stack:
    name: MULTI-STAGE gate packs on a hosted-shaped local Supabase stack (real CLI, real realtime)
    runs-on: ubuntu-latest
    # D7b: read-only package scope for the authenticated ghcr.io image pull only (the same shape as the DB lanes).
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Same pin and rationale as the other browser lanes (grants parity, v1 branch).
          version: 2.102.0

      - name: Configure local auth for the E2E origin
        run: |
          supabase init --force --with-intellij-settings=false --with-vscode-settings=false >/dev/null 2>&1 || supabase init >/dev/null 2>&1 || true
          test -f supabase/config.toml
          sed -i 's|^site_url = .*|site_url = "http://localhost:3111"|' supabase/config.toml
          sed -i 's|^additional_redirect_urls = .*|additional_redirect_urls = ["http://localhost:3111/**", "http://127.0.0.1:3111/**"]|' supabase/config.toml

      # D7b (Sam, 2026-10-22, option A). Same sanctioned read-only ghcr.io
      # login as the other Supabase-starting jobs, pinned by
      # tests/ci/ci-config.test.ts.
      - name: Log in to ghcr.io for Supabase images (D7b, read-only)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI-REGISTRY (OPS, 2026-10-27; supply-chain fixes from Insurance PEER-1200-SUPPLY).
      # The D7b login succeeds, then the stack start pulls ~10 images at once and
      # ghcr.io answers "toomanyrequests ... allowed: 44000/minute" (a short burst
      # throttle across parallel jobs); docker and the CLI do not retry, and the
      # bind-retry step correctly refuses (not a port collision). Mechanism from
      # Team's proven rehearsal (#1193, run 40552718991): pull each image ahead of
      # the start with a bounded back-off and a registry fallback, so the start finds
      # it locally. The list is the pinned CLI's OWN image list (the embedded
      # Dockerfile, sibling supabase-go), for this job's exact -x set plus
      # postgres, realtime and storage-api, which the start pulls while initialising
      # the database even when excluded (runs 40557844633, 40559826388, 40562452255).
      # EVERY pull is BY DIGEST from the committed, reviewed table
      # .github/supabase-image-digests.json (generated from ghcr.io/supabase for CLI
      # 2.102.0); an image is tagged ghcr.io/supabase/<name>:<tag> only after its
      # digest is confirmed, an unverified pull is removed and never tagged, an image
      # missing from the table (or a CLI version other than the table's) is left to
      # the start, and vector/logflare (vector mounts the Docker socket) never use a
      # fallback. Inline, never a checked-out script, because the credential is held
      # (Codex P2 4354172124); the table is read as data. Non-fatal: the start still
      # pulls what is missing, and a start that fails still fails the job.
      - name: Pre-pull Supabase images (bounded back-off; ghcr, then ECR or Docker Hub, by digest)
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          EXCLUDE='studio,imgproxy,edge-runtime,logflare,vector'
          TABLE=.github/supabase-image-digests.json
          cli_v="$(supabase --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if ! command -v jq > /dev/null 2>&1 || [ ! -r "$TABLE" ] || [ "$cli_v" != "$(jq -r '.cli' "$TABLE")" ]; then
            echo "::warning title=Supabase image pre-pull skipped::no digest table for CLI '$cli_v' (or no jq); the stack start pulls as before."
            exit 0
          fi
          pooler_on="$(awk '/^\[db\.pooler\]/{f=1;next} /^\[/{f=0} f && /^enabled *= *true/{print "yes"}' supabase/config.toml 2>/dev/null)"
          BIN="$(command -v supabase || true)"
          : > "$RUNNER_TEMP/cli-images.txt"
          for cand in "$(dirname "$(readlink -f "$BIN")")/supabase-go" "$BIN"; do
            [ -r "$cand" ] || continue
            grep -a -oE '^FROM [A-Za-z0-9_./:-]+ AS (pg|kong|gotrue|postgrest|realtime|storage|imgproxy|edgeruntime|studio|pgmeta|logflare|vector|mailpit|supavisor)$' "$cand" | sort -u > "$RUNNER_TEMP/cli-images.txt"
            [ -s "$RUNNER_TEMP/cli-images.txt" ] && break
          done
          : > "$RUNNER_TEMP/pull-list.txt"
          if [ ! -s "$RUNNER_TEMP/cli-images.txt" ]; then
            echo "::warning title=Supabase image pre-pull skipped::the CLI's embedded image list was not readable; the stack start pulls as before."
            exit 0
          fi
          while read -r _from image _as alias; do
            case "$alias" in pg) svc=postgres ;; storage) svc=storage-api ;; edgeruntime) svc=edge-runtime ;; pgmeta) svc=postgres-meta ;; *) svc="$alias" ;; esac
            case "$svc" in
              postgres|realtime|storage-api) ;;
              supavisor) [ -n "$pooler_on" ] || continue; case ",$EXCLUDE," in *",$svc,"*) continue ;; esac ;;
              *) case ",$EXCLUDE," in *",$svc,"*) continue ;; esac ;;
            esac
            printf '%s %s\n' "${image##*/}" "$image" >> "$RUNNER_TEMP/pull-list.txt"
          done < "$RUNNER_TEMP/cli-images.txt"
          echo "images: $(awk '{print $1}' "$RUNNER_TEMP/pull-list.txt" | tr '\n' ' ')"
          from_ghcr=0; from_fallback=""; missing=""
          while read -r IMG ORIG; do
            NAME="${IMG%%:*}"
            D="$(jq -r --arg k "$IMG" '.images[$k] // empty' "$TABLE")"
            if [ -z "$D" ]; then
              echo "::warning title=Supabase image pre-pull::$IMG is not in the digest table; left to the stack start."
              missing="$missing $IMG"; continue
            fi
            ref=""; via=""
            for i in 1 2; do
              if docker pull -q "ghcr.io/supabase/$NAME@$D" > /dev/null 2>&1; then ref="ghcr.io/supabase/$NAME@$D"; via=ghcr; break; fi
              echo "ghcr pull of $IMG refused (attempt $i)"; sleep $((i*15))
            done
            if [ -z "$ref" ]; then
              case "$NAME" in
                vector|logflare) echo "no fallback for $NAME: it runs with the Docker socket; left to the stack start" ;;
                *)
                  for base in public.ecr.aws/supabase/$NAME docker.io/supabase/$NAME ${ORIG:+docker.io/${ORIG%%:*}}; do
                    if docker pull -q "$base@$D" > /dev/null 2>&1; then
                      if docker image inspect --format '{{json .RepoDigests}}' "$base@$D" 2> /dev/null | grep -q "@$D"; then ref="$base@$D"; via="$base"; break; fi
                      echo "::warning title=Supabase image pre-pull::$base@$D did not report digest $D; discarded, not tagged."
                      docker rmi "$base@$D" > /dev/null 2>&1
                    fi
                  done ;;
              esac
            fi
            if [ -n "$ref" ] && docker tag "$ref" "ghcr.io/supabase/$IMG"; then
              if [ "$via" = ghcr ]; then from_ghcr=$((from_ghcr + 1)); else from_fallback="$from_fallback $IMG($via)"; echo "using $via for $IMG by digest $D, re-tagged locally"; fi
            else
              echo "::warning title=Supabase image pre-pull::$IMG could not be pulled and verified from ghcr, ECR or Docker Hub; left to the stack start."
              missing="$missing $IMG"
            fi
          done < "$RUNNER_TEMP/pull-list.txt"
          echo "pre-pull summary: $from_ghcr from ghcr; fallback by digest:${from_fallback:- none}; left to the start:${missing:- none}"

      - name: Start local Supabase stack (db + auth + storage + REALTIME, the hosted shape)
        id: sb_start
        # realtime is deliberately NOT in the -x list (this job exists to run it). Direct pinned-CLI
        # call while the ghcr.io credential is held: no checked-out script runs
        # before the logout (Codex P2 4354172124).
        continue-on-error: true
        shell: bash
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector 2>&1 | tee "$RUNNER_TEMP/supabase-start.log"

      - name: Log out of ghcr.io (D7b)
        if: always()
        run: docker logout ghcr.io

      - name: Retry Supabase start once on a port-bind collision (no credential)
        if: steps.sb_start.outcome == 'failure'
        run: bash scripts/ci/supabase-start-bind-retry.sh --after-failed-start "$RUNNER_TEMP/supabase-start.log" supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Build package P3 (the hosted set AFTER 0254, 0253 and 0255, then 0258, 0272, 0266, 0271)
        run: python3 -I rehearsal/multi-stage/build.py rehearsal/multi-stage/spec/p3.json "$RUNNER_TEMP/ms-pkgx"

      - name: Gate packs, step by step, against the stack (PRE rules, one real push per step, POST read-back, mutation controls)
        run: |
          set -o pipefail
          first=1
          : > "$RUNNER_TEMP/gates-stack.txt"
          for q in full "drop-0258+0272+0266" "drop-0271" "drop-0266"; do
            if [ "$first" = 0 ]; then git checkout -- supabase/migrations && git clean -fdq supabase/migrations && supabase db reset --local > "$RUNNER_TEMP/reset.log" 2>&1 || { echo "FAIL - db reset before $q" | tee -a "$RUNNER_TEMP/gates-stack.txt"; tail -3 "$RUNNER_TEMP/reset.log"; }; fi
            first=0
            echo "=========== P3 sequence $q" | tee -a "$RUNNER_TEMP/gates-stack.txt"
            EXTRA_DIR="$PWD/rehearsal/multi-stage/spec/sealed" REHEARSAL_OUT="$RUNNER_TEMP/gates-out-$q" bash scripts/ci/gate-pack-stack-rehearsal.sh "$RUNNER_TEMP/ms-pkgx" "$q" 2>&1 | tee -a "$RUNNER_TEMP/gates-stack.txt"
          done
          ! grep -q "^FAIL" "$RUNNER_TEMP/gates-stack.txt"

      - name: Gate pack 0256 on the hosted set after 0254 (single step, below head, real push, read-back, mutation controls)
        run: |
          set -o pipefail
          git checkout -- supabase/migrations && git clean -fdq supabase/migrations && supabase db reset --local > "$RUNNER_TEMP/reset256.log" 2>&1 || { echo "FAIL - db reset before 0256"; tail -3 "$RUNNER_TEMP/reset256.log"; exit 1; }
          python3 -I rehearsal/multi-stage/build.py rehearsal/multi-stage/spec/p256.json "$RUNNER_TEMP/ms-pkg256"
          EXTRA_DIR="$PWD/rehearsal/multi-stage/spec/sealed" REHEARSAL_OUT="$RUNNER_TEMP/gates-out-0256" bash scripts/ci/gate-pack-stack-rehearsal.sh "$RUNNER_TEMP/ms-pkg256" full 2>&1 | tee "$RUNNER_TEMP/gates-stack-0256.txt"
          ! grep -q "^FAIL" "$RUNNER_TEMP/gates-stack-0256.txt"

      - name: Upload the read-back results (read-only catalog facts, no data)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-pack-stack-results
          path: ${{ runner.temp }}/gates-out
          retention-days: 7
